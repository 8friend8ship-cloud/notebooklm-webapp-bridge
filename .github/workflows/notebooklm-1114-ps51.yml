name: NotebookLM 1.1.114 PS51 Parse
on:
  push:
    paths:
      - '.github/workflows/notebooklm-1114-ps51.yml'
      - 'local-agent/releases/1.1.114/HomeDesignLocalAgent.ps1'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $f='local-agent/releases/1.1.114/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
          if($errors.Count){foreach($e in $errors){Write-Host ($e.Extent.StartLineNumber.ToString()+':'+$e.Extent.StartColumnNumber+' '+$e.Message)};exit 1}
          $s=Get-Content $f -Raw -Encoding UTF8
          foreach($n in @('AGENT_1.1.114_CHAT_SEND_CONTROL_CHROME_READONLY','cdpBrowser','dedicatedProcesses','nearButtons','allButtons','normalChromeTouched=$false')){if(-not $s.Contains($n)){throw ('MISSING '+$n)}}
          Write-Host 'PARSE_AND_CONTRACT_PASS_1.1.114'
