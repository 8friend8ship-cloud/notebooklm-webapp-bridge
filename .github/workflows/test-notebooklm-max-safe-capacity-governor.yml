name: test-notebooklm-max-safe-capacity-governor

on:
  pull_request:
    paths:
      - 'apps-script/NotebookLmMaxSafeCapacityGovernor.gs'
      - 'tests/notebooklm-capacity-governor.test.cjs'
      - '.github/workflows/test-notebooklm-max-safe-capacity-governor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run capacity governor safety tests
        run: node tests/notebooklm-capacity-governor.test.cjs
