name: add-existing-artifact-download-0263-once
on:
  push:
    paths:
      - '.github/workflows/add-existing-artifact-download-0263-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing Studio artifact download route
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          root=Path('notebooklm-webapp-bridge-source-v0.2.0/extension')
          runner=root/'content/notebooklm-runner.js'
          manifest=root/'manifest.json'
          r=runner.read_text(encoding='utf-8')
          anchor='''  async function runStudioArtifact(task, spec) {\n'''
          insert='''  function existingArtifactCard(matchWords) {\n    const nodes=deepQueryAll("section,article,div,[role=group],[role=region]").filter(visible);\n    const hits=[];\n    for (const el of nodes) {\n      const t=(el.innerText||el.textContent||"").trim();\n      if (!t || t.length>5000) continue;\n      const n=norm(t);\n      if (!matchWords.some(w=>n.includes(norm(w)))) continue;\n      if (/생성 중|generating|creating|만드는 중|준비 중|preparing/.test(n)) continue;\n      const menu=artifactMenuButtonWithin(el);\n      if (!menu) continue;\n      hits.push({el,t});\n    }\n    hits.sort((a,b)=>a.t.length-b.t.length);\n    return hits[0]?.el||null;\n  }\n\n  async function runExistingStudioArtifactDownload(task, spec) {\n    const studio=findDeepControl(["studio","스튜디오"]);\n    if (studio) { try { studio.click(); } catch {} await sleep(900); }\n    const root=await waitFor(()=>existingArtifactCard(spec.matchWords),30000,500);\n    if (!root) throw new Error(`${spec.code}_EXISTING_ARTIFACT_CARD_NOT_FOUND`);\n    const startedAtEpochMs=Date.now();\n    const menu=artifactMenuButtonWithin(root);\n    if (!menu) throw new Error(`${spec.code}_EXISTING_ARTIFACT_MENU_NOT_FOUND`);\n    try { menu.click(); } catch {}\n    await sleep(700);\n    const download=await waitFor(()=>openArtifactDownloadAction(),8000,250);\n    if (!download) throw new Error(`${spec.code}_EXISTING_DOWNLOAD_ACTION_NOT_FOUND`);\n    try { download.click(); } catch {}\n    await sleep(1200);\n    return {\n      resultText:(root.innerText||root.textContent||"").trim().slice(0,1200),\n      resultUrls:[location.href],\n      captureMode:`${spec.code}_EXISTING_MENU_DOWNLOAD_REQUESTED`,\n      artifactType:spec.code,\n      artifactMirrorRequest:{artifactType:spec.code,startedAtEpochMs},\n      notebookUrl:location.href,pageTitle:document.title,capturedAt:new Date().toISOString(),\n      status:"DONE",taskId:task.taskId,contentId:task.contentId||"",taskType:task.taskType||`${spec.code}_EXISTING_DOWNLOAD`\n    };\n  }\n\n'''
          if anchor not in r: raise SystemExit('runStudioArtifact anchor missing')
          r=r.replace(anchor,insert+anchor,1)
          map_anchor='''    if (["DATA_TABLE","NOTEBOOKLM_DATA_TABLE"].includes(normalizedTaskType)) return runDataTable(task);\n'''
          mapping='''    if (["DATA_TABLE_EXISTING_DOWNLOAD","NOTEBOOKLM_DATA_TABLE_EXISTING_DOWNLOAD"].includes(normalizedTaskType)) return runExistingStudioArtifactDownload(task,{code:"DATA_TABLE",matchWords:["contentos-stage-table.xlsx",".xlsx",".csv"]});\n    if (["REPORT_EXISTING_DOWNLOAD","NOTEBOOKLM_REPORT_EXISTING_DOWNLOAD"].includes(normalizedTaskType)) return runExistingStudioArtifactDownload(task,{code:"REPORT",matchWords:["보고서","report",".pdf",".docx"]});\n    if (["SLIDES_EXISTING_DOWNLOAD","NOTEBOOKLM_SLIDES_EXISTING_DOWNLOAD"].includes(normalizedTaskType)) return runExistingStudioArtifactDownload(task,{code:"SLIDES",matchWords:["슬라이드","slides",".pptx",".pdf"]});\n'''
          if map_anchor not in r: raise SystemExit('data table mapping anchor missing')
          r=r.replace(map_anchor,mapping+map_anchor,1)
          runner.write_text(r,encoding='utf-8')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='0.2.63'
          m['description']='D69 adds existing final-artifact card download routes so lightweight XLSX/PDF/PPTX files can validate real download and mirror without regenerating content.'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          relp=Path('runtime/stable/release.json')
          rel=json.loads(relp.read_text(encoding='utf-8'))
          rel['version']='0.2.63'
          rel['actionId']='APPLY_NOTEBOOKLM_0.2.63_D69_EXISTING_ARTIFACT_DOWNLOAD_20260827'
          rel['releasedAt']='2026-08-27T16:36:00+09:00'
          rel['description']='D69 adds existing Studio final-file download paths, beginning with known XLSX data-table card, with actual Windows file and Drive mirror as completion gate.'
          rel['requiresUserApproval']=False
          for entry in rel['files']:
            p=root/entry['path']
            if not p.exists(): raise SystemExit(f'missing release file {p}')
            entry['gitBlobSha1']=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          relp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          git commit -m 'Bridge 0.2.63 existing artifact download route' || exit 0
          git push