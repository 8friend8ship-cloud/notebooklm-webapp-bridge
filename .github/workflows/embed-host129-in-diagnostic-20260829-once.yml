name: Validate Agent 1.1.60 unified Flow recovery
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Agent 1.1.60
        shell: pwsh
        run: |
          $path='local-agent/releases/1.1.60/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 2}
          $t=Get-Content $path -Raw
          foreach($needle in @("$AgentVersion='1.1.60'",'0.2.74','274aef614763cfe1d886fd16c5641e0b64ab6176','FLOW_UNIFIED_RECOVERY_1.1.60.json','normalChromeTouched=$false','generateClicked=$false','creditSpend=$false')){if(-not $t.Contains($needle)){throw "missing $needle"}}
          Write-Host 'AGENT_1_1_60_PARSE_AND_SAFETY_PASS'
