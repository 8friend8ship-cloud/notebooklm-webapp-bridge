name: Apply active lock recovery 0.2.73
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0.2.73 patch
        run: python tools/patch_legacy_async_active_lock_0273.py
      - name: Commit stable 0.2.73
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/local-powershell-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix legacy async active lock starvation in 0.2.73'
          git push
