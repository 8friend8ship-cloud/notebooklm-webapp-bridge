name: Validate Agent 1.1.57 syntax
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Agent 1.1.57
        shell: pwsh
        run: |
          $path='local-agent/releases/1.1.57/HomeDesignLocalAgent.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){ $errors | Format-List | Out-String | Write-Error; exit 2 }
          Write-Host 'AGENT_1_1_57_PARSE_PASS'
      - name: Safety contract grep
        shell: pwsh
        run: |
          $t=Get-Content 'local-agent/releases/1.1.57/HomeDesignLocalAgent.ps1' -Raw
          foreach($needle in @('normalChromeTouched=$false','generateClicked=$false','creditSpend=$false','oauthChanged=$false','scopeChanged=$false')){if(-not $t.Contains($needle)){throw "missing safety marker $needle"}}
          Write-Host 'AGENT_1_1_57_SAFETY_MARKERS_PASS'
# validate-1157-20260829
