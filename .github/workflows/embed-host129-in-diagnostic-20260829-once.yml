name: Publish clean stable bridge 0.2.74
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate active-lock helpers
        run: python tools/clean_active_lock_duplicates_0274.py
      - name: Validate runner duplicate count
        shell: bash
        run: |
          set -euo pipefail
          c=$(grep -c 'function activeStableTime(active)' notebooklm-webapp-bridge-source-v0.2.0/extension/local-powershell-runner.js)
          test "$c" -eq 1
          grep -q '"version": "0.2.74"' notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
      - name: Commit clean stable files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/local-powershell-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean duplicate active-lock recovery helpers in 0.2.74'
          git push
