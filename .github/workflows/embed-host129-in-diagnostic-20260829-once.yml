name: Validate Agent 1.1.58 Host 1.3.0 handoff
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Agent 1.1.58
        shell: pwsh
        run: |
          $path='local-agent/releases/1.1.58/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 2}
          $t=Get-Content $path -Raw
          foreach($needle in @("$TargetHostVersion='1.3.0'",'274aef614763cfe1d886fd16c5641e0b64ab6176','HOST_1.3.0_CONTENTS_API_HANDOFF','normalChromeTouched=$false','generateClicked=$false','creditSpend=$false')){if(-not $t.Contains($needle)){throw "missing $needle"}}
          Write-Host 'AGENT_1_1_58_PARSE_AND_SAFETY_PASS'
# validate-1158-20260829
