name: Build Host 1.3.0 Contents API transport
on:
  push:
    paths:
      - .github/workflows/embed-host129-in-diagnostic-20260829-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Host 1.3.0
        run: python tools/build_host130_contents_api.py
      - name: Parse Host 1.3.0
        shell: pwsh
        run: |
          $path='local-agent/releases/1.3.0/HomeDesignLocalCommandHost.final.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 2}
          $t=Get-Content $path -Raw
          if($t -match 'raw\.githubusercontent\.com'){throw 'raw GitHub dependency remains in Host 1.3.0'}
          foreach($needle in @('api.github.com/repos/','SCRIPT_CONTENTS_API_SHA_MISMATCH',"$HostVersion='1.3.0'")){if(-not $t.Contains($needle)){throw "missing $needle"}}
          Write-Host 'HOST_1_3_0_PARSE_AND_TRANSPORT_PASS'
      - name: Commit Host 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local-agent/releases/1.3.0/HomeDesignLocalCommandHost.final.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Host 1.3.0 Contents API script transport'
          git push
