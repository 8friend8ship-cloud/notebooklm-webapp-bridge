name: test-agent133-extension-wake-diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'local-agent/releases/1.1.33/HomeDesignLocalAgent.ps1'
      - 'tests/host125-agent130.test.ps1'
      - 'tests/download-handoff.test.mjs'
      - '.github/workflows/test-agent133-extension-wake-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $f='local-agent/releases/1.1.33/HomeDesignLocalAgent.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};throw 'POWERSHELL_SYNTAX_FAIL'}
      - name: Changed-condition no-repeat contract
        shell: pwsh
        run: |
          $t=Get-Content 'local-agent/releases/1.1.33/HomeDesignLocalAgent.ps1' -Raw
          foreach($needle in @('prior132MarkerPresent','prior132LocalEvidencePresent','PRIOR_1.1.32_WAKE_MARKER_PRESENT_NO_REPEAT','AGENT_1.1.33_EXTENSION_WAKE_DIAGNOSTIC.attempted','AGENT_1.1.33_EXTENSION_WAKE_DIAGNOSTIC.json','wakePerformed=$false','normalChromeUntouched=$true','tokenContentsRead=$false','newOAuth=$false','newScope=$false','publicPublish=$false','destructive=$false')){
            if(-not $t.Contains($needle)){throw "MISSING_DIAGNOSTIC_GUARD:$needle"}
          }
          if($t -match 'Stop-Process.+chrome' -or $t -match 'taskkill.+chrome'){throw 'CHROME_KILL_FORBIDDEN_IN_DIAGNOSTIC_WRAPPER'}
      - name: Exact lineage contract
        shell: pwsh
        run: |
          $t=Get-Content 'local-agent/releases/1.1.33/HomeDesignLocalAgent.ps1' -Raw
          foreach($needle in @("$AgentVersion='1.1.33'","$HostVersion='1.2.6'",'AGENT_1.1.33_RECOVERY.json','HOST126_FIRST_AUTORESUME_1.1.33','5d17bb233706897cd1706930cea9af3796f29488')){
            if(-not $t.Contains($needle)){throw "MISSING_AGENT133_LINEAGE:$needle"}
          }
      - name: Existing regressions remain green before promotion
        shell: pwsh
        run: |
          ./tests/host125-agent130.test.ps1
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_REGRESSION_FAIL'}
          node --test tests/download-handoff.test.mjs
          if($LASTEXITCODE -ne 0){throw 'DOWNLOAD_REGRESSION_FAIL'}
      - name: Secret-like literal guard
        shell: pwsh
        run: |
          $bad=Select-String -Path 'local-agent/releases/1.1.33/HomeDesignLocalAgent.ps1' -Pattern 'sk-proj-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,}' -AllMatches
          if($bad){throw 'SECRET_LIKE_LITERAL_FOUND'}
