name: hotfix-notebooklm-audio-overview-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-audio-overview-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Audio Overview UI automation and publish stable 0.2.33
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          runner = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          text = runner.read_text(encoding='utf-8')

          anchor = '  async function runTask(task) {\n'
          if anchor not in text:
              raise SystemExit('runTask anchor missing')

          audio_code = r'''
  function audioOverviewContainer() {
    const nodes = deepQueryAll("section,article,div,[role='group'],[role='region']").filter(visible);
    return nodes.find(el => {
      const t = norm(el.innerText || el.textContent || "");
      return t.includes("audio overview") || t.includes("오디오 개요") || t.includes("음성 개요");
    }) || null;
  }

  function audioOverviewReady() {
    for (const el of deepQueryAll("audio")) {
      try {
        if (el.currentSrc || el.src || Number.isFinite(el.duration)) return el;
      } catch {}
    }
    const c = audioOverviewContainer();
    if (!c) return null;
    const t = norm(c.innerText || c.textContent || "");
    const buttons = [...c.querySelectorAll("button,[role='button']")].filter(visible);
    const labels = buttons.map(b => norm([b.innerText,b.textContent,b.getAttribute("aria-label"),b.getAttribute("title")].join(" "))).join(" ");
    if (/play|재생|download|다운로드|share|공유/.test(labels) && !/generating|생성 중|creating|만드는 중/.test(t)) return c;
    return null;
  }

  async function runAudioOverview(task) {
    const source = await addSource(task);
    if (!source.ok && task.sourceText) {
      throw new Error(`AUDIO_SOURCE_ADD_FAILED: ${source.reason || "unknown"}`);
    }

    const studio = findDeepControl(["studio","스튜디오"]);
    if (studio) {
      try { studio.click(); } catch {}
      await sleep(1200);
    }

    const readyBefore = audioOverviewReady();
    if (readyBefore) {
      return {
        resultText:"AUDIO_OVERVIEW_READY_EXISTING",
        resultUrls:[location.href],
        captureMode:"AUDIO_PLAYER_EXISTING",
        notebookUrl:location.href,
        pageTitle:document.title,
        capturedAt:new Date().toISOString(),
        status:"DONE",
        taskId:task.taskId,
        contentId:task.contentId || "",
        taskType:task.taskType || "AUDIO_OVERVIEW",
        source
      };
    }

    const audioControl = await waitFor(() => findDeepControl(["audio overview","오디오 개요","음성 개요"]), 30000, 500);
    if (!audioControl) throw new Error(`AUDIO_OVERVIEW_CONTROL_NOT_FOUND: ${location.href}`);
    try { audioControl.click(); } catch {}
    await sleep(1500);

    const generate = await waitFor(() => {
      for (const d of dialogs()) {
        const b = findButton(["생성","만들기","generate","create"], d);
        if (b) return b;
      }
      const c = audioOverviewContainer();
      if (c) {
        const b = [...c.querySelectorAll("button,[role='button']")].filter(visible).find(el => {
          const t = norm([el.innerText,el.textContent,el.getAttribute("aria-label"),el.getAttribute("title")].join(" "));
          return /generate|create|생성|만들기/.test(t);
        });
        if (b) return b;
      }
      return null;
    }, 12000, 400);

    if (generate) {
      try { generate.click(); } catch {}
      await sleep(1200);
    }

    const timeoutMs = Math.max(180000, Number(task.timeoutSeconds || 600) * 1000);
    const ready = await waitFor(() => audioOverviewReady(), timeoutMs, 2500);
    if (!ready) throw new Error("AUDIO_OVERVIEW_GENERATION_TIMEOUT_OR_PLAYER_NOT_FOUND");

    return {
      resultText:"AUDIO_OVERVIEW_READY",
      resultUrls:[location.href],
      captureMode:"AUDIO_PLAYER_READY",
      notebookUrl:location.href,
      pageTitle:document.title,
      capturedAt:new Date().toISOString(),
      status:"DONE",
      taskId:task.taskId,
      contentId:task.contentId || "",
      taskType:task.taskType || "AUDIO_OVERVIEW",
      source
    };
  }

'''
          text = text.replace(anchor, audio_code + anchor, 1)

          branch_anchor = '    if (!task?.taskId) throw new Error("TASK_ID가 없습니다.");\n\n'
          if branch_anchor not in text:
              raise SystemExit('task validation anchor missing')
          branch = '''    const normalizedTaskType = String(task.taskType || "CHAT").toUpperCase();\n    if (["AUDIO", "AUDIO_OVERVIEW", "NOTEBOOKLM_AUDIO"].includes(normalizedTaskType)) {\n      return runAudioOverview(task);\n    }\n\n'''
          text = text.replace(branch_anchor, branch_anchor + branch, 1)
          runner.write_text(text, encoding='utf-8')

          manifest = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '0.2.33'
          m['description'] = 'D36 adds NotebookLM/Gemini Notebook Audio Overview generation through the existing Studio UI and verifies a ready audio player. Preserves D34 result readback and D35 stale-state guard. No new permissions, OAuth, Apps Script, Host, normal-Chrome, publish, or paid changes.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'feat: generate and verify NotebookLM Audio Overview'
          git push

          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)

          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, sys
          runner_sha, manifest_sha, source_commit = sys.argv[1:4]
          p = Path('runtime/stable/release.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['actionId'] = 'APPLY_NOTEBOOKLM_0.2.33_D36_AUDIO_OVERVIEW_20260826'
          d['version'] = '0.2.33'
          d['releasedAt'] = '2026-08-26T18:50:00+09:00'
          d['description'] = 'D36 adds Audio Overview generation via Studio and requires actual ready-player evidence before DONE. Existing permissions and approved runtime are reused; no new OAuth, Apps Script deployment, Host/Worker, normal Chrome restart, publish, or paid action.'
          d['sourceCommit'] = source_commit
          for f in d['files']:
              if f['path'] == 'manifest.json': f['gitBlobSha1'] = manifest_sha
              if f['path'] == 'content/notebooklm-runner.js': f['gitBlobSha1'] = runner_sha
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.33 audio overview'
          git push
