name: add-cdp-download-governor-action-once
on:
  push:
    paths:
      - '.github/workflows/add-cdp-download-governor-action-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch governor
        run: python tools/patch_cdp_governor.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-agent/governor/RunChromeGovernorReadback.ps1
          git commit -m 'Add CDP trusted-click NotebookLM download governor action' || exit 0
          git push