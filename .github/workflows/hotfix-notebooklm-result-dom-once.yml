name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Korean Audio Overview labels and publish stable 0.2.35
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          runner = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          text = runner.read_text(encoding='utf-8')
          old1 = 'return t.includes("audio overview") || t.includes("오디오 개요") || t.includes("음성 개요");'
          new1 = 'return t.includes("audio overview") || t.includes("ai 오디오 오버뷰") || t.includes("오디오 오버뷰") || t.includes("오디오 개요") || t.includes("음성 개요");'
          if old1 not in text:
              raise SystemExit('audio container label target missing')
          text = text.replace(old1, new1, 1)
          old2 = 'findDeepControl(["audio overview","오디오 개요","음성 개요"])'
          new2 = 'findDeepControl(["audio overview","ai 오디오 오버뷰","오디오 오버뷰","오디오 개요","음성 개요"])'
          if old2 not in text:
              raise SystemExit('audio control label target missing')
          text = text.replace(old2, new2, 1)
          runner.write_text(text, encoding='utf-8')

          manifest = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '0.2.35'
          m['description'] = 'D38 updates Audio Overview selectors for the current Korean Gemini Notebook labels AI 오디오 오버뷰/오디오 오버뷰. Keeps existing-source fallback and requires actual ready-player evidence before DONE. No new permissions or approvals.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: support current Korean Audio Overview labels'
          git push

          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)

          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, sys
          runner_sha, manifest_sha, source_commit = sys.argv[1:4]
          p = Path('runtime/stable/release.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['actionId'] = 'APPLY_NOTEBOOKLM_0.2.35_D38_KO_AUDIO_OVERVIEW_LABELS_20260826'
          d['version'] = '0.2.35'
          d['releasedAt'] = '2026-08-26T19:08:00+09:00'
          d['description'] = 'D38 updates current Korean Gemini Notebook Audio Overview UI labels and preserves actual ready-player verification. Existing approved runtime only.'
          d['sourceCommit'] = source_commit
          for f in d['files']:
              if f['path'] == 'manifest.json': f['gitBlobSha1'] = manifest_sha
              if f['path'] == 'content/notebooklm-runner.js': f['gitBlobSha1'] = runner_sha
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.35'
          git push
