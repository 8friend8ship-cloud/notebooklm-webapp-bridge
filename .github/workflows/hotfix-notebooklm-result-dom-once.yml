name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Serialize artifact mirror handling and publish stable 0.2.49
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,base64
          art=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js')
          s=art.read_text(encoding='utf-8')
          old=base64.b64decode('').decode()
          new=base64.b64decode('Z2xvYmFsVGhpcy5fX05MTV9NSVJST1JfQVJUSUZBQ1RfVE9fRFJJVkVfXyA9IG5sbU1pcnJvckFydGlmYWN0Ow==').decode()
          if old not in s: raise SystemExit('artifact listener target missing')
          art.write_text(s.replace(old,new,1),encoding='utf-8')

          bg=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/background.js')
          s=bg.read_text(encoding='utf-8')
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if old not in s: raise SystemExit('background listener target missing')
          bg.write_text(s.replace(old,new,1),encoding='utf-8')

          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.49'
          m['description']='D52 serializes MIRROR_ARTIFACT_TO_DRIVE through the primary background listener to remove response races. Preserves D51 audio-card detection and actual-file Drive mirror.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js notebooklm-webapp-bridge-source-v0.2.0/extension/background.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: serialize NotebookLM artifact mirror listener'
          git push
          ART_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js)
          BG_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/background.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$ART_SHA" "$BG_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          asha,bgsha,msha,commit=sys.argv[1:5]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.49_D52_SERIAL_ARTIFACT_MIRROR_20260826'
          d['version']='0.2.49'
          d['releasedAt']='2026-08-26T23:12:00+09:00'
          d['description']='D52 removes competing mirror message responses by routing through one background listener.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='background.js': f['gitBlobSha1']=bgsha
              if f['path']=='artifact-drive-mirror.js': f['gitBlobSha1']=asha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.49'
          git push
