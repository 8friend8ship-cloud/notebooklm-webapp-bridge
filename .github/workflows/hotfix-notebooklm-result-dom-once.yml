name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner + publish stable 0.2.31
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          runner = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          text = runner.read_text(encoding='utf-8')
          old_marker = r'const m = String(task?.instruction || "").match(/\bNLM_E2E_PASS_[A-Z0-9_-]+\b/i);'
          new_marker = r'const m = String(task?.instruction || "").match(/\bNLM_[A-Z0-9_-]*PASS[A-Z0-9_-]*\b/i);'
          if old_marker not in text:
              raise SystemExit('marker patch target missing')
          text = text.replace(old_marker, new_marker, 1)
          old_loop = 'for (const el of document.querySelectorAll(sel)) {'
          count = text.count(old_loop)
          if count != 2:
              raise SystemExit(f'expected 2 result DOM loops, found {count}')
          text = text.replace(old_loop, 'for (const el of deepQueryAll(sel)) {')
          runner.write_text(text, encoding='utf-8')

          manifest = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '0.2.31'
          m['description'] = 'D34 fixes NotebookLM result readback for current UI by scanning open shadow roots and accepting central PASS marker variants. No permission, OAuth, Apps Script, Host, normal-Chrome, publish, or paid changes.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: recover NotebookLM result readback on current UI'
          git push

          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)

          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, sys
          runner_sha, manifest_sha, source_commit = sys.argv[1:4]
          p = Path('runtime/stable/release.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['actionId'] = 'APPLY_NOTEBOOKLM_0.2.31_D34_RESULT_DOM_20260826'
          d['version'] = '0.2.31'
          d['releasedAt'] = '2026-08-26T18:00:00+09:00'
          d['description'] = 'D34 current-UI result readback fix: deep shadow-root scan for assistant results plus central PASS marker compatibility. No permission expansion, OAuth, Apps Script mutation/redeploy, Host/Worker change, normal Chrome restart, publish, or paid action.'
          d['sourceCommit'] = source_commit
          for f in d['files']:
              if f['path'] == 'manifest.json': f['gitBlobSha1'] = manifest_sha
              if f['path'] == 'content/notebooklm-runner.js': f['gitBlobSha1'] = runner_sha
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.31'
          git push
