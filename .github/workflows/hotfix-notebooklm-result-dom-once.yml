name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture Audio DOM evidence and publish stable 0.2.52
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,base64
          p=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          s=p.read_text(encoding='utf-8')
          marker='  async function requestNotebookArtifactDownload(readyNode) {'
          if 'function audioArtifactDomDiagnostic()' not in s:
              payload=''
              s=s.replace(marker,base64.b64decode(payload).decode('utf-8')+marker,1)
          old='    if (!root) return {requested:false, reason:"real audio artifact card not found", startedAtEpochMs};'
          new='    if (!root) return {requested:false, reason:`real audio artifact card not found DOM=${JSON.stringify(audioArtifactDomDiagnostic())}`, startedAtEpochMs};'
          if old not in s: raise SystemExit('audio no-root target missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.52'
          m['description']='D56 diagnostic captures real visible Audio DOM evidence when artifact-card detection fails. No false PASS.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'diag: capture NotebookLM Audio DOM evidence'
          git push
          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          rsha,msha,commit=sys.argv[1:4]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.52_D56_AUDIO_DOM_DIAGNOSTIC_20260827'
          d['version']='0.2.52'
          d['releasedAt']='2026-08-27T11:13:00+09:00'
          d['description']='D56 captures visible Audio DOM evidence on artifact-card selector failure.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='content/notebooklm-runner.js': f['gitBlobSha1']=rsha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.52'
          git push
