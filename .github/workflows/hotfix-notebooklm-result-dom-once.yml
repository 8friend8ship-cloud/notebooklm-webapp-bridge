name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner for Audio Overview and publish stable 0.2.33
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          runner = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          text = runner.read_text(encoding='utf-8')
          if 'async function runAudioOverview(task)' in text:
              raise SystemExit('audio overview patch already present')

          anchor = '  async function runTask(task) {\n'
          if anchor not in text:
              raise SystemExit('runTask anchor missing')

          audio_code = '''  function audioOverviewContainer() {\n    const nodes = deepQueryAll("section,article,div,[role=group],[role=region]").filter(visible);\n    return nodes.find(el => {\n      const t = norm(el.innerText || el.textContent || "");\n      return t.includes("audio overview") || t.includes("오디오 개요") || t.includes("음성 개요");\n    }) || null;\n  }\n\n  function audioOverviewReady() {\n    for (const el of deepQueryAll("audio")) {\n      try {\n        if (el.currentSrc || el.src || Number.isFinite(el.duration)) return el;\n      } catch {}\n    }\n    const c = audioOverviewContainer();\n    if (!c) return null;\n    const t = norm(c.innerText || c.textContent || "");\n    const labels = [...c.querySelectorAll("button,[role=button]")].filter(visible).map(b => norm([b.innerText,b.textContent,b.getAttribute("aria-label"),b.getAttribute("title")].join(" "))).join(" ");\n    if (/play|재생|download|다운로드|share|공유/.test(labels) && !/generating|생성 중|creating|만드는 중/.test(t)) return c;\n    return null;\n  }\n\n  async function runAudioOverview(task) {\n    const source = await addSource(task);\n    if (!source.ok && task.sourceText) throw new Error(`AUDIO_SOURCE_ADD_FAILED: ${source.reason || "unknown"}`);\n\n    const studio = findDeepControl(["studio","스튜디오"]);\n    if (studio) { try { studio.click(); } catch {} await sleep(1200); }\n\n    const audioControl = await waitFor(() => findDeepControl(["audio overview","오디오 개요","음성 개요"]), 30000, 500);\n    if (!audioControl) throw new Error(`AUDIO_OVERVIEW_CONTROL_NOT_FOUND: ${location.href}`);\n\n    const before = audioOverviewReady();\n    if (!before) {\n      try { audioControl.click(); } catch {}\n      await sleep(1200);\n\n      const generate = await waitFor(() => {\n        for (const d of dialogs()) {\n          const b = findButton(["생성","만들기","generate","create"], d);\n          if (b) return b;\n        }\n        const c = audioOverviewContainer();\n        if (!c) return null;\n        return [...c.querySelectorAll("button,[role=button]")].filter(visible).find(el => {\n          const t = norm([el.innerText,el.textContent,el.getAttribute("aria-label"),el.getAttribute("title")].join(" "));\n          return /generate|create|생성|만들기/.test(t);\n        }) || null;\n      }, 12000, 400);\n      if (generate) { try { generate.click(); } catch {} await sleep(1000); }\n    }\n\n    const timeoutMs = Math.max(180000, Number(task.timeoutSeconds || 600) * 1000);\n    const ready = await waitFor(() => audioOverviewReady(), timeoutMs, 2500);\n    if (!ready) throw new Error("AUDIO_OVERVIEW_GENERATION_TIMEOUT_OR_PLAYER_NOT_FOUND");\n\n    return {\n      resultText:"AUDIO_OVERVIEW_READY",\n      resultUrls:[location.href],\n      captureMode:"AUDIO_PLAYER_READY",\n      notebookUrl:location.href,\n      pageTitle:document.title,\n      capturedAt:new Date().toISOString(),\n      status:"DONE",\n      taskId:task.taskId,\n      contentId:task.contentId || "",\n      taskType:task.taskType || "AUDIO_OVERVIEW",\n      source\n    };\n  }\n\n'''
          text = text.replace(anchor, audio_code + anchor, 1)

          gate = '    if (!task?.taskId) throw new Error("TASK_ID가 없습니다.");\n\n'
          if gate not in text:
              raise SystemExit('task gate missing')
          branch = '    const normalizedTaskType = String(task.taskType || "CHAT").toUpperCase();\n    if (["AUDIO","AUDIO_OVERVIEW","NOTEBOOKLM_AUDIO"].includes(normalizedTaskType)) return runAudioOverview(task);\n\n'
          text = text.replace(gate, gate + branch, 1)
          runner.write_text(text, encoding='utf-8')

          manifest = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '0.2.33'
          m['description'] = 'D36 adds Audio Overview generation through Studio and verifies actual ready-player evidence. Preserves D34 result readback and D35 stale-state guard. No new permissions, OAuth, Apps Script, Host, normal Chrome, publish, or paid changes.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'feat: add NotebookLM Audio Overview runtime'
          git push

          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)

          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, sys
          runner_sha, manifest_sha, source_commit = sys.argv[1:4]
          p = Path('runtime/stable/release.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['actionId'] = 'APPLY_NOTEBOOKLM_0.2.33_D36_AUDIO_OVERVIEW_20260826'
          d['version'] = '0.2.33'
          d['releasedAt'] = '2026-08-26T18:55:00+09:00'
          d['description'] = 'D36 adds Audio Overview generation through Studio with actual ready-player verification before DONE. Existing approved runtime and permissions are reused.'
          d['sourceCommit'] = source_commit
          for f in d['files']:
              if f['path'] == 'manifest.json': f['gitBlobSha1'] = manifest_sha
              if f['path'] == 'content/notebooklm-runner.js': f['gitBlobSha1'] = runner_sha
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.33'
          git push
