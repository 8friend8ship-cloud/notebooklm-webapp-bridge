name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find Audio card from menu ancestry and publish stable 0.2.47
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,base64
          p=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('  function audioArtifactCardRoot(readyNode) {')
          end=s.index('  async function requestNotebookArtifactDownload', start)
          payload=''
          new=base64.b64decode(payload).decode('utf-8')
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.47'
          m['description']='D50 finds the real Audio artifact card by walking upward from each visible menu button and matching duration plus source/deep-dive evidence. Preserves Drive mirror routing.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: find NotebookLM audio card from menu ancestry'
          git push
          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          rsha,msha,commit=sys.argv[1:4]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.47_D50_AUDIO_MENU_ANCESTRY_20260826'
          d['version']='0.2.47'
          d['releasedAt']='2026-08-26T22:24:00+09:00'
          d['description']='D50 resolves the real Audio card from its menu-button ancestry and retains D49 mirror routing.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='content/notebooklm-runner.js': f['gitBlobSha1']=rsha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.47'
          git push
