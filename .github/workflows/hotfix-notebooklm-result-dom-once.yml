name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Audio Overview source fallback and publish stable 0.2.34
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          runner = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          text = runner.read_text(encoding='utf-8')
          old = '    const source = await addSource(task);\n    if (!source.ok && task.sourceText) throw new Error(`AUDIO_SOURCE_ADD_FAILED: ${source.reason || "unknown"}`);\n\n'
          new = '    const source = await addSource(task);\n    const sourceFallback = !source.ok && Boolean(task.sourceText);\n\n'
          if old not in text:
              raise SystemExit('audio source fail-closed target missing')
          text = text.replace(old, new, 1)
          old_return = '      source\n    };\n  }\n\n  async function runTask(task) {'
          new_return = '      source: {...source, existingNotebookFallback: sourceFallback}\n    };\n  }\n\n  async function runTask(task) {'
          if old_return not in text:
              raise SystemExit('audio return target missing')
          text = text.replace(old_return, new_return, 1)
          runner.write_text(text, encoding='utf-8')

          manifest = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '0.2.34'
          m['description'] = 'D37 allows Audio Overview to reuse existing notebook sources when current Gemini Notebook source-add control is unavailable, while still requiring actual ready-player evidence before DONE. No new permissions, OAuth, Apps Script, Host, normal Chrome, publish, or paid changes.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: allow Audio Overview existing-source fallback'
          git push

          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)

          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, sys
          runner_sha, manifest_sha, source_commit = sys.argv[1:4]
          p = Path('runtime/stable/release.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['actionId'] = 'APPLY_NOTEBOOKLM_0.2.34_D37_AUDIO_EXISTING_SOURCE_FALLBACK_20260826'
          d['version'] = '0.2.34'
          d['releasedAt'] = '2026-08-26T19:03:00+09:00'
          d['description'] = 'D37 Audio Overview can reuse existing notebook sources when source-add UI is unavailable, but DONE still requires an actual ready audio player. Existing approved runtime only.'
          d['sourceCommit'] = source_commit
          for f in d['files']:
              if f['path'] == 'manifest.json': f['gitBlobSha1'] = manifest_sha
              if f['path'] == 'content/notebooklm-runner.js': f['gitBlobSha1'] = runner_sha
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.34'
          git push
