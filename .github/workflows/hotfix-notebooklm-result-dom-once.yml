name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden Studio artifact detector and publish stable 0.2.40
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js')
          s=p.read_text(encoding='utf-8')
          old='''      if (!words.some(w => n.includes(norm(w)))) continue;\n      if (/생성 중|generating|creating|만드는 중|준비 중|preparing/.test(n)) continue;\n      if (/소스\\s*\\d+개|sources?\\s*\\d+|읽지 않음|unread|다운로드|download|more_vert|재생|play|cards?|questions?|slides?|pages?/.test(n) || t.length > 40) { seen.add(t); out.push(t); }'''
          new='''      if (!words.some(w => n.includes(norm(w)))) continue;\n      if (/생성 중|generating|creating|만드는 중|준비 중|preparing/.test(n)) continue;\n      const studioMenuHits = ["ai 오디오 오버뷰","슬라이드 자료","동영상 개요","마인드맵","보고서","플래시카드","퀴즈","인포그래픽","데이터 표"].filter(x => n.includes(x)).length;\n      if (studioMenuHits >= 4) continue;\n      const artifactSignal = /소스\\s*\\d+개|sources?\\s*\\d+|읽지 않음|unread|다운로드|download|more_vert|재생|play|cards?|questions?|slides?|pages?/.test(n);\n      if (artifactSignal) { seen.add(t); out.push(t); }'''
          if old not in s: raise SystemExit('studio artifact detector target missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.40'
          m['description']='D43 hardens Studio artifact detection: whole-Studio containers are rejected and type label plus artifact-card evidence is required before DONE. No new permissions.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: require real Studio artifact-card evidence'
          git push
          RUNNER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$RUNNER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          rsha,msha,commit=sys.argv[1:4]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.40_D43_ARTIFACT_CARD_GUARD_20260826'
          d['version']='0.2.40'
          d['releasedAt']='2026-08-26T20:38:00+09:00'
          d['description']='D43 rejects whole-Studio false matches and requires actual artifact-card evidence.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='content/notebooklm-runner.js': f['gitBlobSha1']=rsha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.40'
          git push
