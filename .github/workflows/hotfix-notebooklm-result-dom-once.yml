name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route artifact mirror message and publish stable 0.2.46
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/background.js')
          s=p.read_text(encoding='utf-8')
          old='''chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {\n  (async () => {'''
          new='''chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {\n  if (message?.source === SOURCE && message?.type === "MIRROR_ARTIFACT_TO_DRIVE") return false;\n  (async () => {'''
          if old not in s: raise SystemExit('background onMessage target missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.46'
          m['description']='D49 lets MIRROR_ARTIFACT_TO_DRIVE pass to its dedicated worker listener instead of the generic background unsupported-message response.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/background.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: route NotebookLM artifact mirror message'
          git push
          BG_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/background.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$BG_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          bgsha,msha,commit=sys.argv[1:4]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.46_D49_ARTIFACT_MIRROR_MESSAGE_ROUTE_20260826'
          d['version']='0.2.46'
          d['releasedAt']='2026-08-26T22:14:00+09:00'
          d['description']='D49 routes MIRROR_ARTIFACT_TO_DRIVE to the dedicated mirror listener.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='background.js': f['gitBlobSha1']=bgsha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.46'
          git push
