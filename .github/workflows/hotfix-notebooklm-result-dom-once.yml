name: hotfix-notebooklm-result-dom-once

on:
  push:
    paths:
      - '.github/workflows/hotfix-notebooklm-result-dom-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load artifact mirror first and publish stable 0.2.50
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          worker=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/worker.js')
          worker.write_text('import "./artifact-drive-mirror.js";\nimport "./local-stable-self-heal.js";\nimport "./local-active-guard.js";\nimport "./local-powershell-runner.js";\nimport "./flow-script-id-direct-recovery.js";\nimport "./chat-active-guard.js";\n',encoding='utf-8')
          mpath=Path('notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['version']='0.2.50'
          m['description']='D53 loads artifact-drive-mirror before Local/background polling so MIRROR_ARTIFACT_TO_DRIVE handler is ready before any task can run. Worker reload also reconciles stale Local active state.'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/worker.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json
          git commit -m 'fix: initialize artifact mirror before background poll'
          git push
          WORKER_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/worker.js)
          MANIFEST_SHA=$(git hash-object notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json)
          SOURCE_COMMIT=$(git rev-parse HEAD)
          python - "$WORKER_SHA" "$MANIFEST_SHA" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json,sys
          wsha,msha,commit=sys.argv[1:4]
          p=Path('runtime/stable/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['actionId']='APPLY_NOTEBOOKLM_0.2.50_D53_MIRROR_IMPORT_ORDER_20260827'
          d['version']='0.2.50'
          d['releasedAt']='2026-08-27T01:00:00+09:00'
          d['description']='D53 initializes artifact mirror before Local/background poll and lets worker reload reconcile stale Local active state.'
          d['sourceCommit']=commit
          for f in d['files']:
              if f['path']=='manifest.json': f['gitBlobSha1']=msha
              if f['path']=='worker.js': f['gitBlobSha1']=wsha
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add runtime/stable/release.json
          git commit -m 'chore: promote NotebookLM bridge stable 0.2.50'
          git push
