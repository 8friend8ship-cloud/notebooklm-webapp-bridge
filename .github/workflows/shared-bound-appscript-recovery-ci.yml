name: Shared Bound Apps Script Recovery CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readonly-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Recover-ExistingBoundAppsScript.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Read-only command contract
        shell: pwsh
        run: |
          $p = Get-Content -Raw 'tools/Recover-ExistingBoundAppsScript.ps1'
          $forbidden = @('clasp login','clasp create','clasp push','clasp deploy','clasp undeploy')
          foreach ($f in $forbidden) { if ($p -match [regex]::Escape($f)) { throw "FORBIDDEN_MUTATION_COMMAND:$f" } }
          foreach ($required in @('show-authorized-user','list-scripts','clone-script','list-deployments','mutationPerformed = $false')) {
            if ($p -notmatch [regex]::Escape($required)) { throw "MISSING_READONLY_GUARD:$required" }
          }
      - name: Parameter contract
        shell: pwsh
        run: |
          $p = Get-Content -Raw 'tools/Recover-ExistingBoundAppsScript.ps1'
          foreach ($required in @('TargetTitle','ExpectedSpreadsheetId','ExpectedDeploymentId')) {
            if ($p -notmatch $required) { throw "MISSING_PARAMETER:$required" }
          }
