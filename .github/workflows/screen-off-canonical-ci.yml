name: screen-off-canonical

on:
  push:
    paths:
      - 'local-agent/bootstrap/CentralAgentPowerContinuityGuard.ps1'
      - 'local-agent/bootstrap/CentralAgentTabSupervisor.ps1'
      - '.github/workflows/screen-off-canonical-ci.yml'
  pull_request:
    paths:
      - 'local-agent/bootstrap/CentralAgentPowerContinuityGuard.ps1'
      - 'local-agent/bootstrap/CentralAgentTabSupervisor.ps1'
      - '.github/workflows/screen-off-canonical-ci.yml'

jobs:
  canonical-power-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify screen-off canonical contract
        shell: pwsh
        run: |
          $guardPath='local-agent/bootstrap/CentralAgentPowerContinuityGuard.ps1'
          $supervisorPath='local-agent/bootstrap/CentralAgentTabSupervisor.ps1'
          $guard=Get-Content $guardPath -Raw
          $supervisor=Get-Content $supervisorPath -Raw
          if($guard -notmatch 'POWER_CONTINUITY_GUARD_V6_AC_SYSTEM_AWAKE_SCREEN_OFF_20260909'){ throw 'GUARD_V6_VERSION_MISSING' }
          if($guard -match '\$ES_DISPLAY_REQUIRED'){ throw 'DISPLAY_REQUIRED_REGRESSION' }
          if($guard -notmatch 'screenOffAllowed=\$true'){ throw 'SCREEN_OFF_NOT_ALLOWED' }
          if($guard -notmatch 'ES_CONTINUOUS-bor\$ES_SYSTEM_REQUIRED'){ throw 'SYSTEM_REQUIRED_MISSING' }
          if($supervisor -notmatch "RequiredPowerGuardVersion='POWER_CONTINUITY_GUARD_V6_AC_SYSTEM_AWAKE_SCREEN_OFF_20260909'"){ throw 'SUPERVISOR_V6_REQUIREMENT_MISSING' }
          if($supervisor -notmatch 'SCREEN_CAN_OFF'){ throw 'SUPERVISOR_SCREEN_OFF_POLICY_MISSING' }
          if($supervisor -match 'REMOTE_DISPLAY_AWAKE'){ throw 'SUPERVISOR_DISPLAY_AWAKE_REGRESSION' }
          Write-Host 'SCREEN_OFF_CANONICAL_PASS'
