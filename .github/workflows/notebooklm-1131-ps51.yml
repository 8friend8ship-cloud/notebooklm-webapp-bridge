name: NotebookLM 1.1.131 PS51 Parse
on:
  push:
    paths:
      - '.github/workflows/notebooklm-1131-ps51.yml'
      - 'local-agent/releases/1.1.131/HomeDesignLocalAgent.ps1'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $f='local-agent/releases/1.1.131/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
          if($errors.Count){foreach($e in $errors){Write-Host ($e.Extent.StartLineNumber.ToString()+':'+$e.Extent.StartColumnNumber+' '+$e.Message)};exit 1}
          $s=Get-Content $f -Raw -Encoding UTF8
          foreach($n in @('AGENT_1.1.131_CAPTUREBRIDGE_AUDIO_HANDOFF','35482290','1f14e203d0d8a7a2939803fb5a04e92386d95b35cc313e3c7f4a74083ef0e74c','CaptureBridge','INBOX','NotebookLM','SOURCE_VERIFY','CAPTURE_INBOX_COPY','sourceImmutableVerified')){if(-not $s.Contains($n)){throw ('MISSING_CONTRACT '+$n)}}
          Write-Host 'PARSE_AND_CONTRACT_PASS_1.1.131'
