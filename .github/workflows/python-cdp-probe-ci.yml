name: Python CDP probe CI

on:
  push:
    paths:
      - 'local-agent/python/cdp_probe_v0_1.py'
      - '.github/workflows/python-cdp-probe-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        shell: pwsh
        run: python -m py_compile local-agent/python/cdp_probe_v0_1.py
      - name: Start mock CDP endpoint
        shell: pwsh
        run: |
          @'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/json/version':
                      body={'Browser':'Chrome/151.0.0.0','Protocol-Version':'1.3'}
                  elif self.path == '/json':
                      body=[{'id':'page-1','type':'page','title':'Flow','url':'https://labs.google/fx/tools/flow','webSocketDebuggerUrl':'ws://127.0.0.1:9224/devtools/page/page-1'}]
                  else:
                      self.send_response(404); self.end_headers(); return
                  data=json.dumps(body).encode()
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(data)))
                  self.end_headers(); self.wfile.write(data)
              def log_message(self,*args): pass
          HTTPServer(('127.0.0.1',9224),H).serve_forever()
          '@ | Set-Content $env:RUNNER_TEMP\mock_cdp.py -Encoding UTF8
          Start-Process python -ArgumentList $env:RUNNER_TEMP\mock_cdp.py
          Start-Sleep -Seconds 2
      - name: Probe mock CDP
        shell: pwsh
        run: |
          python local-agent/python/cdp_probe_v0_1.py --port 9224 --out $env:RUNNER_TEMP\cdp.json
          $r=Get-Content $env:RUNNER_TEMP\cdp.json -Raw | ConvertFrom-Json
          if(-not $r.ok){ throw 'probe not ok' }
          if($r.pageCount -ne 1){ throw 'expected one page' }
          if($r.pages[0].url -ne 'https://labs.google/fx/tools/flow'){ throw 'wrong page url' }
          if($r.browserMutated -or $r.navigationPerformed -or $r.generateClicked -or $r.credentialsTouched){ throw 'read-only guard failed' }
      - name: Safety guards
        shell: pwsh
        run: |
          $s=Get-Content -LiteralPath 'local-agent/python/cdp_probe_v0_1.py' -Raw
          foreach($x in @('readOnly','browserMutated','navigationPerformed','generateClicked','credentialsTouched')){
            if(-not $s.Contains($x)){ throw "missing guard $x" }
          }
          foreach($x in @('Runtime.evaluate','Page.navigate','Input.dispatchMouseEvent','Network.setCookie')){
            if($s.Contains($x)){ throw "forbidden mutating CDP token $x" }
          }
