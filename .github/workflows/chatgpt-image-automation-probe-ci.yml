name: ChatGPT Image automation probe CI
on:
  push:
    paths:
      - 'local-agent/jobs/Run-ChatGPTImageAutomationProbeV1.ps1'
      - 'local-agent/governor/Run-ChatGPTImagePostRecoveryInspect.ps1'
      - 'local-agent/governor/Inspect-ChatGPTImageAutoManifest.ps1'
      - 'local-agent/governor/Capture-ChatGPTImageDeclaredEntrypointsV1.ps1'
      - 'local-agent/governor/Analyze-ChatGPTImageEntrypointContractV1.ps1'
      - 'local-agent/releases/1.1.70/HomeDesignLocalAgent.ps1'
      - 'local-agent/stable/agent.json'
      - '.github/workflows/chatgpt-image-automation-probe-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $files=@(
            'local-agent/jobs/Run-ChatGPTImageAutomationProbeV1.ps1',
            'local-agent/governor/Run-ChatGPTImagePostRecoveryInspect.ps1',
            'local-agent/governor/Inspect-ChatGPTImageAutoManifest.ps1',
            'local-agent/governor/Capture-ChatGPTImageDeclaredEntrypointsV1.ps1',
            'local-agent/governor/Analyze-ChatGPTImageEntrypointContractV1.ps1',
            'local-agent/releases/1.1.70/HomeDesignLocalAgent.ps1'
          )
          foreach($f in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Error;exit 1}
          }
      - name: Validate queue probe safety and exact chain
        shell: pwsh
        run: |
          $p=Get-Content 'local-agent/jobs/Run-ChatGPTImageAutomationProbeV1.ps1' -Raw
          foreach($needle in @('Run-ChatGPTImagePostRecoveryInspect.ps1','Capture-ChatGPTImageDeclaredEntrypointsV1.ps1','Analyze-ChatGPTImageEntrypointContractV1.ps1','generateClicked=$false','creditsSpent=$false','CHATGPT_IMAGE_AUTOMATION_PROBE_V1.json')){
            if(-not $p.Contains($needle)){throw "missing queue contract: $needle"}
          }
      - name: Validate stable 1.1.70 direct probe and pins
        shell: pwsh
        run: |
          $a=Get-Content 'local-agent/releases/1.1.70/HomeDesignLocalAgent.ps1' -Raw
          foreach($needle in @("`$AgentVersion='1.1.70'","`$PinnedBase='9dce2a7bb83d96a3d846a92e24f468b7a67cb38a'","`$PinnedInspect='49d5fc958c1e6d683156380e5ca18a101af27cf9'","`$PinnedCapture='18d07e9b1796e154746df05fc35b110ced9148d7'","`$PinnedAnalyze='e0514cb6933ce02a0be5087e4deb6876f49ab34c'",'CHATGPT_IMAGE_DIRECT_PROBE_1.1.70.json','generateClicked=$false','creditSpend=$false','oauthChanged=$false','extensionMutated=$false')){
            if(-not $a.Contains($needle)){throw "missing stable contract: $needle"}
          }
          $m=Get-Content 'local-agent/stable/agent.json' -Raw | ConvertFrom-Json
          if($m.version -ne '1.1.70'){throw 'stable version mismatch'}
          if($m.gitBlobSha1 -ne '2dc7ccf22a30fe2748ed10faffc74790d6cb3e72'){throw 'stable blob mismatch'}
          Write-Host 'CHATGPT_IMAGE_DIRECT_STABLE_PROBE_STATIC_PASS'
