name: fix-existing-inline-mirror-0264-once
on:
  push:
    paths:
      - '.github/workflows/fix-existing-inline-mirror-0264-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing artifact inline mirror gate
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          root=Path('notebooklm-webapp-bridge-source-v0.2.0/extension')
          runner=root/'content/notebooklm-runner.js'
          manifest=root/'manifest.json'
          r=runner.read_text(encoding='utf-8')
          old='''    try { download.click(); } catch {}\n    await sleep(1200);\n    return {\n      resultText:(root.innerText||root.textContent||"").trim().slice(0,1200),\n      resultUrls:[location.href],\n      captureMode:`${spec.code}_EXISTING_MENU_DOWNLOAD_REQUESTED`,\n      artifactType:spec.code,\n      artifactMirrorRequest:{artifactType:spec.code,startedAtEpochMs},\n      notebookUrl:location.href,pageTitle:document.title,capturedAt:new Date().toISOString(),\n      status:"DONE",taskId:task.taskId,contentId:task.contentId||"",taskType:task.taskType||`${spec.code}_EXISTING_DOWNLOAD`\n    };\n'''
          new='''    try { download.click(); } catch {}\n    await sleep(1200);\n    const mirrored=await mirrorNotebookArtifactToDrive(task,spec.code,startedAtEpochMs);\n    if (!mirrored?.ok || !mirrored?.mirror?.ok) {\n      throw new Error(`${spec.code}_EXISTING_REAL_FILE_NOT_FOUND_OR_MIRROR_FAILED:${mirrored?.error||mirrored?.mirror?.error||mirrored?.raw?.stderr||"unknown"}`);\n    }\n    return {\n      resultText:(root.innerText||root.textContent||"").trim().slice(0,1200),\n      resultUrls:[location.href],\n      captureMode:`${spec.code}_EXISTING_REAL_FILE_MIRRORED`,\n      artifactType:spec.code,\n      actualArtifact:{mirror:mirrored.mirror,localTaskId:mirrored.localTaskId},\n      notebookUrl:location.href,pageTitle:document.title,capturedAt:new Date().toISOString(),\n      status:"DONE",taskId:task.taskId,contentId:task.contentId||"",taskType:task.taskType||`${spec.code}_EXISTING_DOWNLOAD`\n    };\n'''
          if old not in r: raise SystemExit('existing artifact return block missing')
          r=r.replace(old,new,1)
          runner.write_text(r,encoding='utf-8')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='0.2.64'
          m['description']='D70 requires inline local-file mirror success for existing Studio artifact downloads before DONE.'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          relp=Path('runtime/stable/release.json')
          rel=json.loads(relp.read_text(encoding='utf-8'))
          rel['version']='0.2.64'
          rel['actionId']='APPLY_NOTEBOOKLM_0.2.64_D70_EXISTING_INLINE_MIRROR_GATE_20260827'
          rel['releasedAt']='2026-08-27T16:48:00+09:00'
          rel['description']='D70 makes existing Studio artifact download fail closed until actual Windows file capture and mirror readback succeed.'
          rel['requiresUserApproval']=False
          for entry in rel['files']:
            p=root/entry['path']
            if not p.exists(): raise SystemExit(f'missing release file {p}')
            entry['gitBlobSha1']=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          relp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          git commit -m 'Bridge 0.2.64 existing inline mirror gate' || exit 0
          git push