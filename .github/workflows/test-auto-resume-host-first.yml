name: test-auto-resume-host-first

on:
  push:
    branches:
      - 'fix/notebooklm-host-first-recovery-20260828'
    paths:
      - 'local-agent/releases/1.2.5/HomeDesignLocalCommandHost.ps1'
      - 'local-agent/releases/1.1.29/HomeDesignLocalAgent.ps1'
      - 'local-agent/stable/agent.json'
      - 'tests/auto-resume-host-first.test.ps1'
      - '.github/workflows/test-auto-resume-host-first.yml'
  pull_request:
    paths:
      - 'local-agent/releases/1.2.5/HomeDesignLocalCommandHost.ps1'
      - 'local-agent/releases/1.1.29/HomeDesignLocalAgent.ps1'
      - 'local-agent/stable/agent.json'
      - 'tests/auto-resume-host-first.test.ps1'
      - '.github/workflows/test-auto-resume-host-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host-first recovery regression
        shell: pwsh
        run: ./tests/auto-resume-host-first.test.ps1

      - name: Existing download handoff regression
        shell: pwsh
        run: |
          $files=@(
            'local-agent/governor/MirrorNotebookLMArtifactToDrive.ps1',
            'local-agent/governor/WatchNotebookLMDownloadsToCaptureBridge.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw "POWERSHELL_PARSE_ERROR:$file"}
          }
          npm test
