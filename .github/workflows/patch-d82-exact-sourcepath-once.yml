name: patch-d82-exact-sourcepath-once

on:
  push:
    branches:
      - 'fix/notebooklm-exact-download-sync-20260828-r2'
    paths:
      - '.github/workflows/patch-d82-exact-sourcepath-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch D82 verified download to exact SourcePath mirror
        shell: python
        run: |
          from pathlib import Path

          background = Path('notebooklm-webapp-bridge-source-v0.2.0/extension/background.js')
          s = background.read_text(encoding='utf-8')
          old = '''    const mirrorReq = response?.result?.artifactMirrorRequest;\n    if (mirrorReq) {\n'''
          new = '''    const verifiedDownload = response?.result?.actualArtifact?.downloadEvidence?.download;\n    const mirrorReq = response?.result?.artifactMirrorRequest || (\n      verifiedDownload?.filename ? {\n        artifactType: response?.result?.artifactType || task.taskType || "OTHER",\n        startedAtEpochMs: Date.parse(verifiedDownload.startTime || "") || Date.now(),\n        sourcePath: verifiedDownload.filename\n      } : null\n    );\n    if (mirrorReq) {\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'sourcePath: verifiedDownload.filename' not in s:
              raise SystemExit('BACKGROUND_MIRROR_REQUEST_ANCHOR_MISSING')

          old_call = '''        artifactType: mirrorReq.artifactType || task.taskType || "OTHER",\n        startedAtEpochMs: Number(mirrorReq.startedAtEpochMs || Date.now())\n      });\n'''
          new_call = '''        artifactType: mirrorReq.artifactType || task.taskType || "OTHER",\n        startedAtEpochMs: Number(mirrorReq.startedAtEpochMs || Date.now()),\n        sourcePath: String(mirrorReq.sourcePath || "")\n      });\n'''
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          elif 'sourcePath: String(mirrorReq.sourcePath || "")' not in s:
              raise SystemExit('BACKGROUND_MIRROR_HANDLER_ANCHOR_MISSING')
          background.write_text(s, encoding='utf-8')

          tests = Path('tests/download-handoff.test.mjs')
          t = tests.read_text(encoding='utf-8')
          read_anchor = "const mirrorJs = fs.readFileSync('notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js', 'utf8');\n"
          read_line = "const backgroundJs = fs.readFileSync('notebooklm-webapp-bridge-source-v0.2.0/extension/background.js', 'utf8');\n"
          if read_line not in t:
              if read_anchor not in t:
                  raise SystemExit('TEST_READ_ANCHOR_MISSING')
              t = t.replace(read_anchor, read_anchor + read_line, 1)

          test_block = '''\ntest('Existing verified download synthesizes exact SourcePath mirror request', () => {\n  assert.match(backgroundJs, /actualArtifact\\?\\.downloadEvidence\\?\\.download/);\n  assert.match(backgroundJs, /sourcePath:\\s*verifiedDownload\\.filename/);\n  assert.match(backgroundJs, /sourcePath:\\s*String\\(mirrorReq\\.sourcePath/);\n});\n'''
          if "Existing verified download synthesizes exact SourcePath mirror request" not in t:
              t += test_block
          tests.write_text(t, encoding='utf-8')

          workflow = Path('.github/workflows/test-download-handoff.yml')
          w = workflow.read_text(encoding='utf-8')
          path_line = "      - 'notebooklm-webapp-bridge-source-v0.2.0/extension/background.js'\n"
          artifact_line = "      - 'notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js'\n"
          if w.count(path_line) < 2:
              w = w.replace(artifact_line, path_line + artifact_line)
          syntax_line = '        run: node --check notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js\n'
          syntax_new = '''        run: |\n          node --check notebooklm-webapp-bridge-source-v0.2.0/extension/background.js\n          node --check notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js\n'''
          if syntax_line in w:
              w = w.replace(syntax_line, syntax_new, 1)
          elif 'node --check notebooklm-webapp-bridge-source-v0.2.0/extension/background.js' not in w:
              raise SystemExit('WORKFLOW_SYNTAX_ANCHOR_MISSING')
          workflow.write_text(w, encoding='utf-8')

      - name: Validate patch before commit
        run: |
          node --check notebooklm-webapp-bridge-source-v0.2.0/extension/background.js
          node --check notebooklm-webapp-bridge-source-v0.2.0/extension/artifact-drive-mirror.js
          npm test

      - name: Commit D82 mirror handoff fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/background.js tests/download-handoff.test.mjs .github/workflows/test-download-handoff.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix D82 verified download mirror handoff'
          git push
