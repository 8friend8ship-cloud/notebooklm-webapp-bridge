name: fix-final-result-card-download-0260-once
on:
  push:
    paths:
      - '.github/workflows/fix-final-result-card-download-0260-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final result card scoped download
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          root=Path('notebooklm-webapp-bridge-source-v0.2.0/extension')
          runner=root/'content/notebooklm-runner.js'
          manifest=root/'manifest.json'
          r=runner.read_text(encoding='utf-8')
          anchor='''  async function requestNotebookArtifactDownload(readyNode) {\n'''
          helper='''  function openArtifactDownloadAction() {\n    const overlays = deepQueryAll("[role='menu'],[role='listbox'],.mat-mdc-menu-panel,.mat-menu-panel,.cdk-overlay-pane").filter(visible);\n    for (const overlay of overlays) {\n      const candidates = [...overlay.querySelectorAll("[role='menuitem'],button,[role='button'],a,div,span")].filter(visible);\n      const hit = candidates.find(el => /(^|\\s)(download|다운로드)(\\s|$)/.test(actionLabel(el)));\n      if (hit) return hit.closest?.("[role='menuitem'],button,[role='button'],a") || hit;\n    }\n    return null;\n  }\n\n'''
          if helper not in r:
              if anchor not in r: raise SystemExit('requestNotebookArtifactDownload anchor not found')
              r=r.replace(anchor,helper+anchor,1)
          old='''    const download = await waitFor(() => findDeepControl(["다운로드","download"]), 8000, 250);\n    if (!download) return {requested:false, reason:"download action not found after real audio card menu", startedAtEpochMs};\n'''
          new='''    const download = await waitFor(() => openArtifactDownloadAction(), 8000, 250);\n    if (!download) return {requested:false, reason:"download action not found inside final artifact card menu", startedAtEpochMs};\n'''
          if old not in r: raise SystemExit('global download lookup block not found')
          r=r.replace(old,new,1)
          runner.write_text(r,encoding='utf-8')

          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='0.2.60'
          m['description']='D66 targets the final generated artifact card kebab menu, selects Download only inside the opened menu, and retains real-file mirror verification before completion.'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          relp=Path('runtime/stable/release.json')
          rel=json.loads(relp.read_text(encoding='utf-8'))
          rel['version']='0.2.60'
          rel['actionId']='APPLY_NOTEBOOKLM_0.2.60_D66_FINAL_RESULT_CARD_DOWNLOAD_20260827'
          rel['releasedAt']='2026-08-27T15:58:00+09:00'
          rel['description']='D66 scopes Download to the menu opened from the final generated artifact card and keeps actual Windows download/mirror verification as the DONE gate.'
          rel['requiresUserApproval']=False
          for entry in rel['files']:
              p=root/entry['path']
              if not p.exists(): raise SystemExit(f'missing release file {p}')
              entry['gitBlobSha1']=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          relp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          git commit -m 'Bridge 0.2.60 final result card download scope' || exit 0
          git push