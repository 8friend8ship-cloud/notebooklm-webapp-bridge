name: Embed Host129 recovery v2
on:
  push:
    paths:
      - .github/workflows/embed-host129-v2-20260829-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/build_embedded_host129_recovery.py
      - run: |
          git diff --check
          grep -Fq 'INLINE_EMBEDDED_NO_SECONDARY_NETWORK' local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1
          grep -Fq '$HostVersion='"'"'1.2.9'"'"'' local-agent/releases/1.2.9/HomeDesignLocalCommandHost.final.ps1
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1 local-agent/releases/1.2.9/HomeDesignLocalCommandHost.final.ps1 local-agent/releases/1.2.9/embedded-host129.sha1
          git commit -m 'Embed Host 1.2.9 no-network recovery payload'
          git push
