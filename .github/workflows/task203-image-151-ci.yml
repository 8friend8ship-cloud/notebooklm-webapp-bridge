name: Task203 image 1.1.151 CI

on:
  push:
    paths:
      - 'local-agent/releases/1.1.151-image-task203-exactdeployment-repair/HomeDesignLocalAgent.ps1'
      - 'local-agent/stable/image.json'
      - '.github/workflows/task203-image-151-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: powershell
        run: |
          $path='local-agent/releases/1.1.151-image-task203-exactdeployment-repair/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
      - name: Verify exact-deployment safety contract
        shell: powershell
        run: |
          $path='local-agent/releases/1.1.151-image-task203-exactdeployment-repair/HomeDesignLocalAgent.ps1'
          $s=Get-Content $path -Raw
          foreach($required in @('ResolveScriptIdByDeployment','SCRIPT_DEPLOYMENT_MATCH_COUNT_','EXISTING_DEPLOYMENT_UPDATE_FAILED_NO_CREATE_FALLBACK','UpdateDeploymentStrict','rollbackAttempted','librarianPhysicalTriggerCount')){if(-not$s.Contains($required)){throw "MISSING_TASK203_GUARD:$required"}}
          if($s.Contains('throw "SCRIPT_TITLE_NOT_FOUND:$TargetTitle"')){throw 'TITLE_LOOKUP_FAILURE_PATH_REINTRODUCED'}
          if($s.Contains('clasp create-deployment') -or $s.Contains('clasp deploy --deploymentId')){throw 'NEW_DEPLOYMENT_FALLBACK_REINTRODUCED'}
      - name: Verify stable image pointer
        shell: powershell
        run: |
          $f=Get-Content 'local-agent/stable/image.json' -Raw|ConvertFrom-Json
          if(-not$f.enabled){throw 'IMAGE_LANE_DISABLED'}
          if($f.version-ne'1.1.151-image-task203-exactdeployment-repair'){throw 'IMAGE_VERSION_MISMATCH'}
          if($f.gitBlobSha1-ne'baed5cd7bf98b81a313892d640960db26fec77f3'){throw 'IMAGE_SHA_MISMATCH'}
          if($f.resultReceipt-ne'IMAGE_TASK203_EXACTDEPLOY_REPAIR_LIBRARIAN_1.1.151.json'){throw 'IMAGE_RECEIPT_MISMATCH'}
          if($f.generateClicked-ne$false -or $f.creditSpend-ne$false -or $f.normalChromeTouched-ne$false -or $f.oauthChanged-ne$false){throw 'IMAGE_SAFETY_FLAG_MISMATCH'}
          Write-Host 'TASK203_IMAGE_151_STATIC_CONTRACT_PASS'
