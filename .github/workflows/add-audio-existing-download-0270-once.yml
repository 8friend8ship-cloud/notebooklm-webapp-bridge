name: add-audio-existing-download-0270-once
on:
  push:
    paths:
      - '.github/workflows/add-audio-existing-download-0270-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bridge 0.2.70
        run: python tools/patch_audio_existing_0270.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          git commit -m 'Add safe existing-audio real-download route in Bridge 0.2.70' || exit 0
          git push