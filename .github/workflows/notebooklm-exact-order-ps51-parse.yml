name: NotebookLM Exact Order PS51 Parse
on:
  push:
    paths:
      - '.github/workflows/notebooklm-exact-order-ps51-parse.yml'
      - 'local-agent/releases/1.1.90/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.91/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.92/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.93/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.94/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1'
      - 'local-agent/diagnostics/RunNotebookLMExactOrderedResearchAudioV1.ps1'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'local-agent/releases/1.1.90/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.91/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.92/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.93/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.94/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1',
            'local-agent/diagnostics/RunNotebookLMExactOrderedResearchAudioV1.ps1'
          )
          $bad=$false
          foreach($f in $files){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count){
              $bad=$true
              Write-Host "PARSE_FAIL $f"
              foreach($e in $errors){ Write-Host ($e.Extent.StartLineNumber.ToString()+':'+$e.Extent.StartColumnNumber+' '+$e.Message) }
            } else { Write-Host "PARSE_PASS $f" }
          }
          $diag=Get-Content 'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          foreach($needle in @('AGENT_1.1.95_NOTEBOOKLM_SOURCE_PANEL_READONLY','sourceLikeElements','checkboxCount','possibleSourceCountTokens','normalChromeTouched=$false','bridgeChanged=$false')){
            if(-not $diag.Contains($needle)){ Write-Host ('MISSING_DIAG_CONTRACT '+$needle); $bad=$true }
          }
          if($bad){ exit 1 }
