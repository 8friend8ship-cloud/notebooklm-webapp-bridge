name: NotebookLM Exact Order PS51 Parse
on:
  push:
    paths:
      - '.github/workflows/notebooklm-exact-order-ps51-parse.yml'
      - 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1'
      - 'local-agent/releases/1.1.90/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.91/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.92/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.93/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.94/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.96/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.97/HomeDesignLocalAgent.ps1'
      - 'local-agent/releases/1.1.98/HomeDesignLocalAgent.ps1'
      - 'local-agent/diagnostics/RunNotebookLMExactOrderedResearchAudioV1.ps1'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1',
            'local-agent/releases/1.1.90/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.91/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.92/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.93/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.94/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.96/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.97/HomeDesignLocalAgent.ps1',
            'local-agent/releases/1.1.98/HomeDesignLocalAgent.ps1',
            'local-agent/diagnostics/RunNotebookLMExactOrderedResearchAudioV1.ps1'
          )
          $bad=$false
          foreach($f in $files){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count){$bad=$true;Write-Host "PARSE_FAIL $f";foreach($e in $errors){Write-Host ($e.Extent.StartLineNumber.ToString()+':'+$e.Extent.StartColumnNumber+' '+$e.Message)}}else{Write-Host "PARSE_PASS $f"}
          }
          $resume=Get-Content 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1' -Raw -Encoding UTF8
          foreach($needle in @('RESUME_ONE_SHOT_FETCH_FALLBACK_V2_20260830','RAW_VERIFIED','AUTO_RESUME_FETCH_PATH_LATEST.json','Start-Process powershell.exe','DIRECT_AGENT.stderr.log')){if(-not $resume.Contains($needle)){Write-Host ('MISSING_RESUME_CONTRACT '+$needle);$bad=$true}}
          $diag95=Get-Content 'local-agent/releases/1.1.95/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          foreach($needle in @('AGENT_1.1.95_NOTEBOOKLM_SOURCE_PANEL_READONLY','sourceLikeElements','checkboxCount','possibleSourceCountTokens','normalChromeTouched=$false','bridgeChanged=$false')){if(-not $diag95.Contains($needle)){Write-Host ('MISSING_DIAG95_CONTRACT '+$needle);$bad=$true}}
          $diag96=Get-Content 'local-agent/releases/1.1.96/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          foreach($needle in @('AGENT_1.1.96_FAST_RESEARCH_RESULTS_READONLY_BEFORE_IMPORT','8d1eda83-cfe3-4487-b2bc-266a5be3465c','Fast Research','importClicked=$false','chatSubmitted=$false','studioSelected=$false','generateClicked=$false','normalChromeTouched=$false','bridgeChanged=$false')){if(-not $diag96.Contains($needle)){Write-Host ('MISSING_DIAG96_CONTRACT '+$needle);$bad=$true}}
          $diag97=Get-Content 'local-agent/releases/1.1.97/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          foreach($needle in @('AGENT_1.1.97_FAST_RESEARCH_EDITOR_READONLY','editorControls','searchButtons','researchFilled=$false','researchSubmitted=$false','importClicked=$false','chatSubmitted=$false','studioSelected=$false','generateClicked=$false','normalChromeTouched=$false','bridgeChanged=$false')){if(-not $diag97.Contains($needle)){Write-Host ('MISSING_DIAG97_CONTRACT '+$needle);$bad=$true}}
          $diag98=Get-Content 'local-agent/releases/1.1.98/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          foreach($needle in @('AGENT_1.1.98_FAST_RESEARCH_IMPORT_ONLY','8d1eda83-cfe3-4487-b2bc-266a5be3465c','FAST_RESEARCH_NOT_COMPLETE','IMPORT_BUTTON_NOT_UNIQUE','SOURCE_COUNT_ZERO_AFTER_IMPORT','sourceVerified','chatSubmitted=$false','studioSelected=$false','generateClicked=$false','normalChromeTouched=$false','bridgeChanged=$false')){if(-not $diag98.Contains($needle)){Write-Host ('MISSING_DIAG98_CONTRACT '+$needle);$bad=$true}}
          if($bad){exit 1}
