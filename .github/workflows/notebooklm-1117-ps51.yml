name: NotebookLM 1.1.117 PS51 Parse
on:
  push:
    paths:
      - '.github/workflows/notebooklm-1117-ps51.yml'
      - 'local-agent/releases/1.1.117/HomeDesignLocalAgent.ps1'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $f='local-agent/releases/1.1.117/HomeDesignLocalAgent.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
          if($errors.Count){foreach($e in $errors){Write-Host ($e.Extent.StartLineNumber.ToString()+':'+$e.Extent.StartColumnNumber+' '+$e.Message)};exit 1}
          $s=Get-Content $f -Raw -Encoding UTF8
          foreach($n in @('RunNotebookLMDirectCDPDownloadSyncedV3.ps1','PRIMARY_DOWNLOAD','notebooklm_raw_download_capture.py','PYTHON_INDEPENDENT_VERIFY','expected-media audio','DRIVE_COPY_PRIMARY','Get-FileHash','AUDIO_READY_DOWNLOAD_DRIVE_VERIFY')){if(-not $s.Contains($n)){Write-Host ('MISSING '+$n);exit 1}}
          Write-Host 'PARSE_AND_CONTRACT_PASS_1.1.117'
