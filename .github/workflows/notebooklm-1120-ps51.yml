name: NotebookLM 1.1.120 PS51
on:
  push:
    paths:
      - '.github/workflows/notebooklm-1120-ps51.yml'
      - 'local-agent/releases/1.1.120/HomeDesignLocalAgent.ps1'
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse wrapper and simulated proven readback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $f='local-agent/releases/1.1.120/HomeDesignLocalAgent.ps1'
          $t=$null;$e=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$e)
          if($e.Count){exit 1}
          $src=Get-Content 'local-agent/releases/1.1.110/HomeDesignLocalAgent.ps1' -Raw -Encoding UTF8
          $fixed=$src.Replace('1.1.110','1.1.120')
          foreach($want in @('SOURCE_RESEARCH_STATE_READONLY','savedSourceSignals','importVisible','fastResearchComplete')){if(-not$fixed.Contains($want)){throw ('MISSING '+$want)}}
          $tmp=Join-Path $env:RUNNER_TEMP 'agent120.runtime.ps1';[IO.File]::WriteAllText($tmp,$fixed,(New-Object Text.UTF8Encoding($true)))
          $t2=$null;$e2=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($tmp,[ref]$t2,[ref]$e2);if($e2.Count){exit 1}
          Write-Host 'PASS_1.1.120_READONLY'
