name: Python local worker CI

on:
  push:
    paths:
      - 'local-agent/python/central_queue_worker_v0_1.py'
      - 'local-agent/python/central_control_worker_v1.py'
      - '.github/workflows/python-local-worker-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        shell: pwsh
        run: python -m py_compile local-agent/python/central_queue_worker_v0_1.py
      - name: State-machine self test
        shell: pwsh
        run: python local-agent/python/central_queue_worker_v0_1.py --self-test
      - name: Central control worker compile and self test
        shell: pwsh
        run: |
          python -m py_compile local-agent/python/central_control_worker_v1.py
          python local-agent/python/central_control_worker_v1.py --self-test
      - name: Safety guards
        shell: pwsh
        run: |
          $s=Get-Content -LiteralPath 'local-agent/python/central_queue_worker_v0_1.py' -Raw
          foreach($x in @('EXECUTABLE_STATES = {"READY", "RETRY"}','"CLAIMED"','"STARTED"','"DONE"','"ERROR"','NO_ERROR_AUTORETRY')){
            if(-not $s.Contains($x)){ throw "missing required guard: $x" }
          }
          $s2=Get-Content -LiteralPath 'local-agent/python/central_control_worker_v1.py' -Raw
          foreach($x in @('ALLOWED={"CANARY_ECHO","PYTHON_RUNTIME_INFO","REMOTE_DC_RECOVER_EXACT"}','ACTION_NOT_WHITELISTED','DEDUPED_ALREADY_ATTEMPTED','EXACT_RECOVERY_SCRIPT_MISSING','shell=False')){ if(-not $s2.Contains($x)){ throw "missing central-worker guard: $x" } }
          foreach($x in @('os.system','shell=True','chrome.exe','Secure Preferences','Cookies','password')){ if($s2 -match [regex]::Escape($x)){ throw "forbidden central-worker token: $x" } }
          foreach($x in @('chrome.exe','Secure Preferences','Cookies','password')){
            if($s -match [regex]::Escape($x)){ throw "forbidden direct-browser-data token: $x" }
          }
