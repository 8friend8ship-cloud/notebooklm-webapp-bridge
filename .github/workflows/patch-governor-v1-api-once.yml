name: Governor V1 API Stable Regression CI

on:
  push:
    paths:
      - 'local-agent/governor/RunChromeGovernorReadback.ps1'
      - 'local-agent/governor/RunChromeGovernorReadbackV2.ps1'
      - '.github/workflows/patch-governor-v1-api-once.yml'
  pull_request:
    paths:
      - 'local-agent/governor/RunChromeGovernorReadback.ps1'
      - 'local-agent/governor/RunChromeGovernorReadbackV2.ps1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parse check
        shell: pwsh
        run: |
          foreach($path in @('local-agent/governor/RunChromeGovernorReadback.ps1','local-agent/governor/RunChromeGovernorReadbackV2.ps1')){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Fail closed on raw stable-agent metadata regression
        shell: python
        run: |
          import pathlib, re
          v1=pathlib.Path('local-agent/governor/RunChromeGovernorReadback.ps1').read_text(encoding='utf-8')
          v2=pathlib.Path('local-agent/governor/RunChromeGovernorReadbackV2.ps1').read_text(encoding='utf-8')
          kick=re.search(r'(?ms)^function KickStableAgentRaw \{.*?^\}',v1)
          refresh=re.search(r'(?ms)^function RefreshV2 \{.*?^\}',v1)
          if not kick or not refresh: raise SystemExit('V1_STABLE_HELPER_FUNCTION_MISSING')
          assert 'RefreshV2' in kick.group(0)
          assert '-KickStableAgent' in kick.group(0)
          assert 'raw.githubusercontent.com' not in kick.group(0)
          assert 'Invoke-RestMethod -Uri $Api' in refresh.group(0)
          assert 'FromBase64String' in refresh.group(0)
          assert 'GitHubContent' in v2
          assert "GitHubContent 'local-agent/stable/agent.json'" in v2
          assert 'AGENT_API_SHA_MISMATCH' in v2
          print('GOVERNOR_V1_API_STABLE_REGRESSION_PASS')
