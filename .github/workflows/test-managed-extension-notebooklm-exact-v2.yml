name: Test NotebookLM Exact Target V2
on:
  push:
    paths:
      - 'local-agent/governor/ManagedExtensionAutopilotV2.ps1'
      - 'local-agent/governor/ManagedExtensionExactTargetLauncherV2.ps1'
      - 'tests/managed-extension-notebooklm-exact-v2.test.mjs'
      - '.github/workflows/test-managed-extension-notebooklm-exact-v2.yml'
  workflow_dispatch:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/managed-extension-notebooklm-exact-v2.test.mjs
