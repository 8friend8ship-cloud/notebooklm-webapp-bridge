name: Persona Apps Script Bind CI

on:
  push:
    paths:
      - 'local-agent/governor/Bind-FrontPersonaOrchestrationAppsScriptV1.ps1'
      - '.github/workflows/persona-appscript-bind-ci.yml'
  pull_request:
    paths:
      - 'local-agent/governor/Bind-FrontPersonaOrchestrationAppsScriptV1.ps1'

jobs:
  validate-binder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: powershell
        run: |
          $p='local-agent/governor/Bind-FrontPersonaOrchestrationAppsScriptV1.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors)
          if($errors.Count){$errors | Format-List | Out-String | Write-Error; exit 1}
      - name: Safety and x2 contract
        shell: powershell
        run: |
          $p='local-agent/governor/Bind-FrontPersonaOrchestrationAppsScriptV1.ps1'
          $t=Get-Content $p -Raw
          $required=@(
            "ExpectedDeploymentId='AKfycbzz247_Mwl9c6N1WxmpHAttwHQJB6RCFtaY08XlHgxysz1iEzg7HWDXa3i5oXhDS1jo'",
            "SourceCommit='0ad86472116e73728d99c0c49d940e0a884d4739'",
            "ExpectedSourceBlob='948c056e6d175b5b709b53955abdd3b83869b9c3'",
            'TARGET_BY_DEPLOYMENT','PERSONA_ORCH_FACTORY_ADAPTER_V1','READBACK_X1','READBACK_X2','Restore $target.dir',
            'newProjectCreated=$false','oauthChanged=$false','newDeployment=$false','newTrigger=$false','paidGeminiApiCalled=$false'
          )
          foreach($n in $required){if(-not $t.Contains($n)){throw "MISSING_CONTRACT:$n"}}
          $forbidden=@('clasp login','create-script','create-deployment','ScriptApp.newTrigger')
          foreach($n in $forbidden){if($t -match [regex]::Escape($n)){throw "FORBIDDEN_OPERATION:$n"}}
          Write-Host 'Persona binder safety/x2 contract PASS'
