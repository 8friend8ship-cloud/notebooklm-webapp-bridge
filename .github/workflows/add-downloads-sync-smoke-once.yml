name: add-downloads-sync-smoke-once
on:
  push:
    paths:
      - '.github/workflows/add-downloads-sync-smoke-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagnostic smoke
        shell: python
        run: |
          from pathlib import Path
          p=Path('local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1')
          s=p.read_text(encoding='utf-8')
          old='  [switch]$CreateLocalSaveSmoke,\n  [switch]$SetupCaptureBridgeAutoSync\n)'
          new='  [switch]$CreateLocalSaveSmoke,\n  [switch]$CreateDownloadsSyncSmoke,\n  [switch]$SetupCaptureBridgeAutoSync\n)'
          assert old in s
          s=s.replace(old,new,1)
          marker="if($CreateLocalSaveSmoke){"
          block=r'''if($CreateDownloadsSyncSmoke){
  try{
    $dir=Join-Path $env:USERPROFILE 'Downloads'
    if(-not(Test-Path -LiteralPath $dir)){throw 'WINDOWS_DOWNLOADS_NOT_FOUND'}
    $file=Join-Path $dir '_TEST_DOWNLOADS_DRIVE_SYNC_20260827_1544.txt'
    Set-Content -LiteralPath $file -Value ('DOWNLOADS_DRIVE_SYNC_TEST '+(Get-Date).ToString('o')) -Encoding UTF8
    $item=Get-Item -LiteralPath $file -ErrorAction Stop
    [ordered]@{ok=$true;action='DOWNLOADS_DRIVE_SYNC_SMOKE';folder=$dir;file=$file;size=[int64]$item.Length;exists=$true;at=(Get-Date).ToString('o')}|ConvertTo-Json -Compress
    exit 0
  }catch{
    [ordered]@{ok=$false;action='DOWNLOADS_DRIVE_SYNC_SMOKE';error=$_.Exception.Message;at=(Get-Date).ToString('o')}|ConvertTo-Json -Compress
    exit 2
  }
}

'''
          assert marker in s
          s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1
          git commit -m 'Add Downloads Drive sync smoke' || exit 0
          git push
