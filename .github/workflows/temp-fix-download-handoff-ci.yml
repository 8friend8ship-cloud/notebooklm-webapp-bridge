name: temp-fix-download-handoff-ci

on:
  push:
    branches:
      - 'fix/download-handoff-stable-contract-20260829'
    paths:
      - 'tests/download-handoff.test.mjs'
      - '.github/workflows/temp-fix-download-handoff-ci.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full npm regression suite
        run: npm test
