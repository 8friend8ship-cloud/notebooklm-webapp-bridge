name: Persona Device Recovery Once CI

on:
  push:
    paths:
      - 'local-agent/bootstrap/Run-PersonaBindRecoveryOnce.ps1'
      - 'local-agent/capture/Setup-PowerContinuity.ps1'
      - 'local-agent/releases/1.1.48/HomeDesignLocalAgent.ps1'
      - '.github/workflows/persona-device-recovery-once-ci.yml'
  pull_request:
    paths:
      - 'local-agent/bootstrap/Run-PersonaBindRecoveryOnce.ps1'
      - 'local-agent/capture/Setup-PowerContinuity.ps1'
      - 'local-agent/releases/1.1.48/HomeDesignLocalAgent.ps1'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parse
        shell: powershell
        run: |
          $files=@('local-agent/bootstrap/Run-PersonaBindRecoveryOnce.ps1','local-agent/capture/Setup-PowerContinuity.ps1','local-agent/releases/1.1.48/HomeDesignLocalAgent.ps1')
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
          }
      - name: Pinned and non-destructive recovery contract
        shell: python
        run: |
          from pathlib import Path
          t=Path('local-agent/bootstrap/Run-PersonaBindRecoveryOnce.ps1').read_text(encoding='utf-8')
          p=Path('local-agent/capture/Setup-PowerContinuity.ps1').read_text(encoding='utf-8')
          a=Path('local-agent/releases/1.1.48/HomeDesignLocalAgent.ps1').read_text(encoding='utf-8')
          required=[
            "$ExpectedAgent='1.1.46'",
            "$ExpectedAgentBlob='b72e57af70f77578fddb3de49f6581a37e2de792'",
            "$ExpectedV2Blob='a4b7967da7bc26f3cb49c88d3b3cb122ddf86c7c'",
            "$ExpectedPowerBlob='b98ed149d91cdec4ff75ccf4b03aa7b9e09f241f'",
            "GitHubContent 'local-agent/stable/agent.json'",
            "FetchPinned 'local-agent/governor/RunChromeGovernorReadbackV2.ps1'",
            "FetchPinned 'local-agent/capture/Setup-PowerContinuity.ps1'",
            '-KickStableAgent',
            "-Install -NightStart '02:00' -NightEnd '05:00' -IdleDisplayMinutes 30",
            "POWER_CONTINUITY_WINDOW_MISMATCH",
            "POWER_CONTINUITY_IDLE_MISMATCH",
            "POWER_CONTINUITY_AC_SLEEP_MISMATCH",
            "POWER_CONTINUITY_USB_SUSPEND_MISMATCH",
            "POWER_CONTINUITY_KEYBOARD_GUARD_MISMATCH",
            'newProjectCreated=$false',
            'oauthChanged=$false',
            'scopeChanged=$false',
            'newDeployment=$false',
            'newTrigger=$false',
            'paidGeminiApiCalled=$false'
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('MISSING_RECOVERY_CONTRACT:'+repr(missing))
          power_required=[
            "[int]$IdleDisplayMinutes=30",
            "monitor-timeout-ac $IdleDisplayMinutes",
            "monitor-timeout-dc $IdleDisplayMinutes",
            "standby-timeout-ac 0",
            "hibernate-timeout-ac 0",
            "/setacvalueindex SCHEME_CURRENT $UsbSubGroup $UsbSelectiveSuspend 0",
            "idleDisplayMinutes=$IdleDisplayMinutes",
            "idleDisplayApplies='AC_AND_BATTERY'",
            "acAutomaticSleep='DISABLED'",
            "acUsbSelectiveSuspend='DISABLED'",
            "keyboardFreezeGuard='NO_AC_SLEEP_RESUME_PLUS_USB_SELECTIVE_SUSPEND_DISABLED'",
            "batteryPolicy='DISPLAY_30_MIN_SLEEP_AND_USB_POLICY_NO_OVERRIDE'"
          ]
          pmissing=[x for x in power_required if x not in p]
          if pmissing: raise SystemExit('MISSING_POWER_CONTRACT:'+repr(pmissing))
          agent_required=[
            "$AgentVersion = '1.1.48'",
            "$LegacyAgentSha = 'b72e57af70f77578fddb3de49f6581a37e2de792'",
            "$PowerHelperSha = 'b98ed149d91cdec4ff75ccf4b03aa7b9e09f241f'",
            "function Invoke-PowerShellCaptured([string]$Path, [string[]]$ScriptArgs)",
            "+ @($ScriptArgs)",
            "Invoke-PowerShellCaptured $PowerHelper @('-StatusOnly')",
            "Invoke-PowerShellCaptured $PowerHelper @('-Install','-NightStart','02:00','-NightEnd','05:00','-IdleDisplayMinutes','30')",
            "Recover-AbandonedMarkerOnce",
            "queue-integrity-sync-v2-1.1.45-marker-recovery.once.json",
            "persona-bind-v1-1.1.46-marker-recovery.once.json",
            "AGENT_1.1.48_POWER_CONTINUITY_SELF_HEAL",
            "POWER_CONTINUITY_RUNTIME_READBACK.json",
            "acAutomaticSleep = 'DISABLED'",
            "acAutomaticHibernate = 'DISABLED'",
            "acUsbSelectiveSuspend = 'DISABLED'",
            "keyboardFreezeGuard = 'NO_AC_SLEEP_RESUME_PLUS_USB_SELECTIVE_SUSPEND_DISABLED'",
            "batterySleepAndUsbPolicyOverride = $false",
            "newProjectCreated = $false",
            "oauthChanged = $false",
            "scopeChanged = $false",
            "newDeployment = $false",
            "newTrigger = $false",
            "paidGeminiApiCalled = $false"
          ]
          amissing=[x for x in agent_required if x not in a]
          if amissing: raise SystemExit('MISSING_AGENT_1148_CONTRACT:'+repr(amissing))
          if "function Invoke-PowerShellCaptured([string]$Path, [string[]]$Args)" in a:
            raise SystemExit('AUTOMATIC_ARGS_COLLISION_REGRESSION')
          forbidden=['clasp create','clasp deploy','ScriptApp.newTrigger','GOOGLE_AI_PAID_API_APPROVED=Y']
          bad=[x for x in forbidden if x in t or x in p or x in a]
          if bad: raise SystemExit('FORBIDDEN_ACTION:'+repr(bad))
          print('LOCAL_AGENT_1148_POWER_ARGUMENT_FORWARDING_CONTRACT_PASS')
