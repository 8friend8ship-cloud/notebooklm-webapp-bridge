name: fix-audio-player-card-download-0261-once
on:
  push:
    paths:
      - '.github/workflows/fix-audio-player-card-download-0261-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch audio player-card download path
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          root=Path('notebooklm-webapp-bridge-source-v0.2.0/extension')
          runner=root/'content/notebooklm-runner.js'
          manifest=root/'manifest.json'
          r=runner.read_text(encoding='utf-8')
          old='''  async function requestNotebookArtifactDownload(readyNode) {\n    const startedAtEpochMs = Date.now();\n    const root = audioArtifactCardRoot(readyNode);\n    if (!root) return {requested:false, reason:`real audio artifact card not found DOM=${JSON.stringify(audioArtifactDomDiagnostic())}`, startedAtEpochMs};\n    const localButtons = [...root.querySelectorAll("button,[role='button'],a")].filter(visible);\n    const direct = localButtons.find(el => /(^|\\s)(download|다운로드)(\\s|$)/.test(actionLabel(el)));\n    if (direct) {\n      try { direct.click(); } catch {}\n      await sleep(1200);\n      return {requested:true, method:"DIRECT", startedAtEpochMs, cardText:(root.innerText || root.textContent || "").trim().slice(0,500)};\n    }\n    const menu = artifactMenuButtonWithin(root);\n    if (!menu) return {requested:false, reason:"real audio card menu not found", startedAtEpochMs};\n    try { menu.click(); } catch {}\n    await sleep(700);\n    const download = await waitFor(() => openArtifactDownloadAction(), 8000, 250);\n    if (!download) return {requested:false, reason:"download action not found inside final artifact card menu", startedAtEpochMs};\n    try { download.click(); } catch {}\n    await sleep(1200);\n    return {requested:true, method:"MENU_DOWNLOAD", startedAtEpochMs, cardText:(root.innerText || root.textContent || "").trim().slice(0,500)};\n  }\n'''
          new='''  async function requestAudioArtifactDownload(readyNode) {\n    const startedAtEpochMs = Date.now();\n    const root = audioArtifactCardRoot(readyNode);\n    if (!root) return {requested:false, reason:`audio final player card not found DOM=${JSON.stringify(audioArtifactDomDiagnostic())}`, startedAtEpochMs};\n    const cardText=(root.innerText || root.textContent || "").trim().slice(0,500);\n    const controls=[...root.querySelectorAll("button,[role='button'],a")].filter(visible).map(el=>actionLabel(el)).join(" ");\n    const isAudioPlayer=/play_arrow|(^|\\s)(play|재생)(\\s|$)|pause|일시정지|\\b\\d{1,2}:\\d{2}\\b/.test(norm(cardText+" "+controls));\n    if (!isAudioPlayer) return {requested:false, reason:"target card is not an audio player card", startedAtEpochMs};\n    const menu = artifactMenuButtonWithin(root);\n    if (!menu) return {requested:false, reason:"audio player card kebab menu not found", startedAtEpochMs};\n    try { menu.click(); } catch {}\n    await sleep(700);\n    const download = await waitFor(() => openArtifactDownloadAction(), 8000, 250);\n    if (!download) return {requested:false, reason:"download action not found inside audio player card menu", startedAtEpochMs};\n    try { download.click(); } catch {}\n    await sleep(1200);\n    return {requested:true, method:"AUDIO_PLAYER_CARD_MENU_DOWNLOAD", startedAtEpochMs, cardText};\n  }\n'''
          if old not in r: raise SystemExit('requestNotebookArtifactDownload block not found')
          r=r.replace(old,new,1)
          r=r.replace('const download = await requestNotebookArtifactDownload(ready);','const download = await requestAudioArtifactDownload(ready);',1)
          runner.write_text(r,encoding='utf-8')

          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='0.2.61'
          m['description']='D67 separates audio from other Studio artifact routes: audio uses the final player card kebab menu directly, with real-file verification retained as the completion gate.'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          relp=Path('runtime/stable/release.json')
          rel=json.loads(relp.read_text(encoding='utf-8'))
          rel['version']='0.2.61'
          rel['actionId']='APPLY_NOTEBOOKLM_0.2.61_D67_AUDIO_PLAYER_CARD_DOWNLOAD_20260827'
          rel['releasedAt']='2026-08-27T16:05:00+09:00'
          rel['description']='D67 uses a dedicated audio final-player-card kebab-menu download path; video and document-like artifacts remain separate routes.'
          rel['requiresUserApproval']=False
          for entry in rel['files']:
              p=root/entry['path']
              if not p.exists(): raise SystemExit(f'missing release file {p}')
              entry['gitBlobSha1']=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          relp.write_text(json.dumps(rel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooklm-webapp-bridge-source-v0.2.0/extension/content/notebooklm-runner.js notebooklm-webapp-bridge-source-v0.2.0/extension/manifest.json runtime/stable/release.json
          git commit -m 'Bridge 0.2.61 audio player-card download path' || exit 0
          git push