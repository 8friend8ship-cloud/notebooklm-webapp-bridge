name: Flow local executor recovery CI

on:
  push:
    paths:
      - 'local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1'
      - 'local-agent/bootstrap/RUN_FLOW_RECOVERY_NOW.cmd'
      - 'local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1'
      - 'local-agent/bootstrap/HomeDesignLocalWatchdog.ps1'
      - 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1'
      - 'local-agent/bootstrap/AgentBootstrap.ps1'
      - 'local-agent/stable/flow.json'
      - 'local-agent/governor/Test-FlowCanonicalExtension.ps1'
      - 'local-agent/governor/Sync-GoogleAIAlwaysOnBridgeV102.ps1'
      - 'local-agent/governor/policy.json'
      - 'extensions/google-ai-always-on-bridge/1.0.2/**'
      - 'config/flow-extension-canonical-v0.1.0.json'
      - '.github/workflows/local-executor-flow-recovery-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recovery bootstrap verifier installer watchdog and Always-On updater
        shell: powershell
        run: |
          foreach($p in @('local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1','local-agent/bootstrap/AgentBootstrap.ps1','local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1','local-agent/bootstrap/HomeDesignLocalWatchdog.ps1','local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1','local-agent/governor/Test-FlowCanonicalExtension.ps1','local-agent/governor/Sync-GoogleAIAlwaysOnBridgeV102.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
          }
      - name: Verify Flow V1.6 independent lane auxiliary sync and launcher gates
        shell: powershell
        run: |
          $s=Get-Content 'local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1' -Raw
          foreach($required in @(
            'V1.6_FLOW_INDEPENDENT_LANE_ALWAYS_ON_AUX',
            'state-flow.json',
            'ReadFlowLane',
            'WaitFlowLane',
            'flowIndependentLaneApplied',
            'flowIndependentLaneAppliedVersion',
            '$flowLaneApplied',
            "appliedVersion-eq'1.1.69'",
            'INSTALL_AUTO_RESUME_TASK.ps1',
            'AUTO_RESUME_INSTALL_V3.json',
            '$autoResumeInstallExit-eq0',
            '$periodicTriggerReady',
            '$persistenceReady',
            '$autoResumeImmediateVerified',
            'resumeSkippedBecauseAutoResumeVerified',
            'Sync-GoogleAIAlwaysOnBridgeV102.ps1',
            'GOOGLE_AI_ALWAYS_ON_BRIDGE_V102_SYNC.json',
            'alwaysOnAuxiliaryOnly=$true',
            'AUX_SYNC_',
            'Test-FlowCanonicalExtension.ps1',
            'FLOW_DIRECT_BOOTSTRAP_R10_1.1.69.json',
            'FLOW_PROJECT_LIST_NEW_PROJECT_V8_20260829',
            "flowExtensionVersion='0.1.0'",
            "flowExtensionId='lgedgmpcikglaajhfclcihicgafimlna'",
            "PinnedFlowAgent169='9dce2a7bb83d96a3d846a92e24f468b7a67cb38a'",
            'generateClicked=$false',
            'creditSpend=$false',
            'oauthChanged=$false'
          )){if(-not$s.Contains($required)){throw "MISSING_RECOVERY_GUARD:$required"}}
          if($s.Contains('schtasks.exe /Create')){throw 'RECOVERY_MUST_NOT_REIMPLEMENT_SCHEDULED_TASK_CREATE'}
          if($s.Contains('& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Resume')){throw 'RECOVERY_MUST_NOT_RERUN_RESUME_AFTER_VERIFIED_AUTORUN'}
          if(-not$s.Contains('$coreOk=[bool](')){throw 'CORE_OK_GATE_MISSING'}
          if(-not$s.Contains('-and $flowLaneApplied -and $flowCanonicalOk')){throw 'CORE_OK_MUST_REQUIRE_FLOW_INDEPENDENT_LANE'}
          if($s.Contains('$coreOk=[bool]($installed.alwaysOnUpdater')){throw 'ALWAYS_ON_MUST_REMAIN_AUXILIARY'}

          $bootstrap=Get-Content 'local-agent/bootstrap/AgentBootstrap.ps1' -Raw
          foreach($required in @('ApplyIndependentLane','local-agent/stable/flow.json',"'FLOW'",'HomeDesignLocalAgent-flow.ps1','state-flow.json')){if(-not$bootstrap.Contains($required)){throw "MISSING_BOOTSTRAP_FLOW_LANE:$required"}}
          $flowMeta=Get-Content 'local-agent/stable/flow.json' -Raw|ConvertFrom-Json
          if(-not$flowMeta.enabled){throw 'FLOW_LANE_DISABLED'}
          if($flowMeta.version-ne'1.1.69'){throw 'FLOW_LANE_VERSION_MISMATCH'}
          if($flowMeta.gitBlobSha1-ne'9dce2a7bb83d96a3d846a92e24f468b7a67cb38a'){throw 'FLOW_LANE_SHA_MISMATCH'}
          if($flowMeta.creditSpend){throw 'FLOW_LANE_MUST_NOT_SPEND_CREDITS'}
          if($flowMeta.generateClicked){throw 'FLOW_LANE_MUST_NOT_GENERATE'}

          $i=Get-Content 'local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1' -Raw
          foreach($required in @('INSTALL_AUTO_RESUME_V3','V3.5_PERIODIC_REQUIRED_IGNORE_NEW_SINGLE_EXECUTOR','InstallVerified','SCHEDULED_TASK_FULL_CREATE','SCHEDULED_TASK_5MIN_FALLBACK','FALLBACK_5MIN','FULL_XML','periodicTriggerReady','fullTriggerContractReady','HKCU_LOGON+5MIN_FALLBACK','DIRECT_WATCHDOG_FALLBACK_ONLY','SCHEDULED_WATCHDOG_RECEIPT','WATCHDOG_ENTRY_LATEST.json','scheduledEntryObserved','directWatchdogLaunched','persistenceReady','immediateExecutionVerified','scheduledRunExit','directWatchdogExit','RunDirectWatchdog','$DirectWatchdogTimeoutSeconds=420','$ScheduledEntryWaitSeconds=15','$ScheduledExecutionLimitMinutes=10','LOGON+RESUME+5MIN','<LogonTrigger>','<EventTrigger>','<Interval>PT5M</Interval>','/SC MINUTE /MO 5','triggerIntervalMinutes=5','<MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>',"multipleInstancesPolicy='IgnoreNew'")){if(-not$i.Contains($required)){throw "MISSING_INSTALLER_GUARD:$required"}}
          if($i.Contains('<MultipleInstancesPolicy>StopExisting</MultipleInstancesPolicy>')){throw 'FIVE_MIN_TRIGGER_MUST_NOT_KILL_ACTIVE_RECOVERY'}
          if($i.Contains('DIRECT_WATCHDOG_ALWAYS')){throw 'DIRECT_WATCHDOG_MUST_NOT_ALWAYS_RUN'}
          if($i.IndexOf("$runKey='HKCU:") -lt 0){throw 'HKCU_FALLBACK_MISSING'}
          if($i.IndexOf('$LASTEXITCODE') -lt 0){throw 'SCHEDULED_RUN_EXIT_NOT_CHECKED'}
          if(($i|Select-String -Pattern "taskName='HomeDesignAutomation-AutoResume'" -AllMatches).Matches.Count -ne 1){throw 'CANONICAL_TASK_NAME_MUST_BE_SINGLE'}
          if(-not$i.Contains('$ok=[bool]($runnerSha-and$watchdogSha-and$periodicTriggerReady-and$persistenceReady-and$immediateStarted-and$immediateVerified)')){throw 'INSTALLER_FINAL_OK_MUST_REQUIRE_PERIODIC_TRIGGER'}

          $w=Get-Content 'local-agent/bootstrap/HomeDesignLocalWatchdog.ps1' -Raw
          foreach($required in @('$AutoResumeTimeoutSeconds=360','WATCHDOG_ENTRY_LATEST.json','WATCHDOG_ENTRY_V4','WATCHDOG_SINGLE_EXECUTOR_TIMEOUT_ALIGNED_20260829')){if(-not$w.Contains($required)){throw "MISSING_WATCHDOG_GUARD:$required"}}
          $r=Get-Content 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1' -Raw
          if(-not($r.Contains('EnsureBootstrapLoop $Bootstrap 120') -and $r.Contains('$deadline=(Get-Date).AddSeconds(180)'))){throw 'RESUME_BOUNDED_CYCLE_CONTRACT_CHANGED'}
          if(360 -lt (120+180)){throw 'WATCHDOG_TIMEOUT_BELOW_RESUME_BOUNDED_WAIT'}
          if(420 -le 360){throw 'INSTALLER_DIRECT_TIMEOUT_MUST_EXCEED_WATCHDOG_TIMEOUT'}

          $cmd=Get-Content 'local-agent/bootstrap/RUN_FLOW_RECOVERY_NOW.cmd' -Raw
          foreach($required in @('7af31b9f0e390430cc895751153f1f5db4339cd1','5aa0d630ca865ca43244f7bd325a255ad83beda0','RECOVERY_BLOB_PIN_MISMATCH','RUN_LOCAL_EXECUTOR_RECOVERY_V1.pinned.ps1')){if(-not$cmd.Contains($required)){throw "MISSING_LAUNCHER_PIN:$required"}}
          $c=Get-Content 'config/flow-extension-canonical-v0.1.0.json' -Raw|ConvertFrom-Json
          if($c.version-ne'0.1.0'){throw 'FLOW_CANONICAL_VERSION_MISMATCH'}
          if($c.extensionId-ne'lgedgmpcikglaajhfclcihicgafimlna'){throw 'FLOW_CANONICAL_ID_MISMATCH'}
          Write-Host 'FLOW_LOCAL_EXECUTOR_RECOVERY_V1_6_CONTRACT_PASS'

      - name: Verify Google AI Always-On 1.0.2 path-preserving contract
        shell: powershell
        run: |
          $u=Get-Content 'local-agent/governor/Sync-GoogleAIAlwaysOnBridgeV102.ps1' -Raw
          foreach($required in @("ExtensionId='kieodjjlhpefnakodgllmpckepjaggbd'","ExpectedVersion='1.0.2'","CanonicalRoot='extensions/google-ai-always-on-bridge/1.0.2'",'GOOGLE_AI_ALWAYS_ON_BRIDGE_V102_SYNC.json','V1_PATH_PRESERVE_SECRET_SAFE','CONFIG_MUTATION_DETECTED','NOTEBOOKLM_MUTATION_DETECTED','configContentRead=$false','configPreserved=$true','notebooklmPreserved=$true','normalChromeTouched=$false','duplicateInstallCreated=$false','generateClicked=$false','creditSpend=$false','oauthChanged=$false','scopeChanged=$false','AllowDedicatedRestart','DedicatedUserData','chrome.runtime.reload()','chrome.runtime.getManifest().version','22c1ad5470b355f05d8e53e07c66d068dc16366f7b677dd12fcd15ab2f36a553','bc522b5ccf93b754cdba2454b96e08ce0323b470414058b7dd8657623550a602','80b069153a101b61a37f66bc23890184bda0f0b8ca1bfafa804213afe6997b21')){if(-not$u.Contains($required)){throw "MISSING_ALWAYS_ON_GUARD:$required"}}
          if($u.Contains('Get-Content -LiteralPath $config')){throw 'UPDATER_MUST_NOT_READ_CONFIG_CONTENT'}
          if($u.Contains('Stop-Process') -and -not$u.Contains('Contains($DedicatedUserData)')){throw 'CHROME_STOP_MUST_BE_DEDICATED_SCOPED'}
          $canon=Get-Content 'extensions/google-ai-always-on-bridge/1.0.2/canonical.json' -Raw|ConvertFrom-Json
          if($canon.version-ne'1.0.2'){throw 'ALWAYS_ON_CANONICAL_VERSION_MISMATCH'}
          if($canon.extensionId-ne'kieodjjlhpefnakodgllmpckepjaggbd'){throw 'ALWAYS_ON_CANONICAL_ID_MISMATCH'}
          if($canon.source.projectFolderId-ne'1P3ahSXu7UU96oG74glulCONX4sLyI-8c'){throw 'ALWAYS_ON_DRIVE_SOURCE_MISMATCH'}
          if(-not($canon.preserveFiles -contains 'config.js')){throw 'CONFIG_PRESERVE_CONTRACT_MISSING'}
          if(-not($canon.preserveFiles -contains 'content/notebooklm.js')){throw 'NOTEBOOKLM_PRESERVE_CONTRACT_MISSING'}
          if($canon.policy.normalChromeRestartAllowed){throw 'NORMAL_CHROME_RESTART_MUST_BE_FALSE'}
          if(-not$canon.policy.generationRequiresExplicitApproval){throw 'GENERATION_APPROVAL_GATE_MISSING'}
          if($canon.policy.connectivityProbeMaySpendCredits){throw 'CONNECTIVITY_PROBE_MUST_NOT_SPEND_CREDITS'}
          $policy=Get-Content 'local-agent/governor/policy.json' -Raw|ConvertFrom-Json
          $rule=@($policy.managedExtensions|Where-Object{$_.name-eq'Google AI Local Bridge v1'})|Select-Object -First 1
          if(-not$rule){throw 'ALWAYS_ON_POLICY_RULE_MISSING'}
          if($rule.canonicalVersion-ne'1.0.2'){throw 'ALWAYS_ON_POLICY_VERSION_MISMATCH'}
          if($rule.mode-ne'DRIVE_SOURCE_BOUND_VERIFY_THEN_UPDATE'){throw 'ALWAYS_ON_POLICY_MODE_MISMATCH'}
          if($rule.sourceId-ne'1P3ahSXu7UU96oG74glulCONX4sLyI-8c'){throw 'ALWAYS_ON_POLICY_SOURCE_MISMATCH'}
          node --check 'extensions/google-ai-always-on-bridge/1.0.2/service-worker.js'
          if($LASTEXITCODE-ne0){throw 'SERVICE_WORKER_JS_PARSE_FAILED'}
          node --check 'extensions/google-ai-always-on-bridge/1.0.2/content/flow.js'
          if($LASTEXITCODE-ne0){throw 'FLOW_JS_PARSE_FAILED'}
          $m=Get-Content 'extensions/google-ai-always-on-bridge/1.0.2/manifest.json' -Raw|ConvertFrom-Json
          if($m.version-ne'1.0.2'){throw 'MIRRORED_MANIFEST_VERSION_MISMATCH'}
          Write-Host 'GOOGLE_AI_ALWAYS_ON_BRIDGE_V102_PATH_PRESERVE_CONTRACT_PASS'
