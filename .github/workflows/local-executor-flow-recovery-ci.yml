name: Flow local executor recovery CI

on:
  push:
    paths:
      - 'local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1'
      - 'local-agent/bootstrap/RUN_FLOW_RECOVERY_NOW.cmd'
      - 'local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1'
      - 'local-agent/bootstrap/HomeDesignLocalWatchdog.ps1'
      - 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1'
      - 'local-agent/governor/Test-FlowCanonicalExtension.ps1'
      - 'config/flow-extension-canonical-v0.1.0.json'
      - '.github/workflows/local-executor-flow-recovery-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recovery verifier installer and watchdog
        shell: powershell
        run: |
          foreach($p in @('local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1','local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1','local-agent/bootstrap/HomeDesignLocalWatchdog.ps1','local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1','local-agent/governor/Test-FlowCanonicalExtension.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
          }
      - name: Verify Flow safety canonical persistence trigger timeout overlap and launcher gates
        shell: powershell
        run: |
          $s=Get-Content 'local-agent/bootstrap/RUN_LOCAL_EXECUTOR_RECOVERY_V1.ps1' -Raw
          foreach($required in @(
            "V1.3_AUTOREUME_V3_FLOW_CANONICAL_R10_GATE",
            "INSTALL_AUTO_RESUME_TASK.ps1",
            "AUTO_RESUME_INSTALL_V3.json",
            "autoResumeImmediateExecutionVerified",
            "Test-FlowCanonicalExtension.ps1",
            "FLOW_DIRECT_BOOTSTRAP_R10_1.1.69.json",
            "FLOW_PROJECT_LIST_NEW_PROJECT_V8_20260829",
            "flowExtensionVersion='0.1.0'",
            "flowExtensionId='lgedgmpcikglaajhfclcihicgafimlna'",
            "PinnedFlowAgent169='9dce2a7bb83d96a3d846a92e24f468b7a67cb38a'",
            "alwaysOnBridgeSourceVersion='1.0.2'",
            'generateClicked=$false',
            'creditSpend=$false',
            'oauthChanged=$false'
          )){if(-not$s.Contains($required)){throw "MISSING_RECOVERY_GUARD:$required"}}
          if($s.Contains('schtasks.exe /Create')){throw 'RECOVERY_MUST_NOT_REIMPLEMENT_SCHEDULED_TASK_CREATE'}

          $i=Get-Content 'local-agent/bootstrap/INSTALL_AUTO_RESUME_TASK.ps1' -Raw
          foreach($required in @('INSTALL_AUTO_RESUME_V3','V3.4_IGNORE_NEW_SINGLE_EXECUTOR_TRIGGER_TIMEOUT_ALIGNED','InstallVerified','SCHEDULED_TASK_CREATE','HKCU_RUN','DIRECT_WATCHDOG_FALLBACK_ONLY','SCHEDULED_WATCHDOG_RECEIPT','WATCHDOG_ENTRY_LATEST.json','scheduledEntryObserved','directWatchdogLaunched','persistenceReady','immediateExecutionVerified','scheduledRunExit','directWatchdogExit','RunDirectWatchdog','$DirectWatchdogTimeoutSeconds=420','$ScheduledEntryWaitSeconds=15','$ScheduledExecutionLimitMinutes=10','LOGON+RESUME+5MIN','<LogonTrigger>','<EventTrigger>','<Interval>PT5M</Interval>','triggerIntervalMinutes=5','<MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>',"multipleInstancesPolicy='IgnoreNew'")){if(-not$i.Contains($required)){throw "MISSING_INSTALLER_GUARD:$required"}}
          if($i.Contains('<MultipleInstancesPolicy>StopExisting</MultipleInstancesPolicy>')){throw 'FIVE_MIN_TRIGGER_MUST_NOT_KILL_ACTIVE_RECOVERY'}
          if($i.Contains('DIRECT_WATCHDOG_ALWAYS')){throw 'DIRECT_WATCHDOG_MUST_NOT_ALWAYS_RUN'}
          if($i.IndexOf("$runKey='HKCU:") -lt 0){throw 'HKCU_FALLBACK_MISSING'}
          if($i.IndexOf('$LASTEXITCODE') -lt 0){throw 'SCHEDULED_RUN_EXIT_NOT_CHECKED'}
          if(($i|Select-String -Pattern "taskName='HomeDesignAutomation-AutoResume'" -AllMatches).Matches.Count -ne 1){throw 'CANONICAL_TASK_NAME_MUST_BE_SINGLE'}

          $w=Get-Content 'local-agent/bootstrap/HomeDesignLocalWatchdog.ps1' -Raw
          foreach($required in @('$AutoResumeTimeoutSeconds=360','WATCHDOG_ENTRY_LATEST.json','WATCHDOG_ENTRY_V4','WATCHDOG_SINGLE_EXECUTOR_TIMEOUT_ALIGNED_20260829')){if(-not$w.Contains($required)){throw "MISSING_WATCHDOG_GUARD:$required"}}
          $r=Get-Content 'local-agent/bootstrap/RESUME_LOCAL_AGENT_ONCE.ps1' -Raw
          if(-not($r.Contains('EnsureBootstrapLoop $Bootstrap 120') -and $r.Contains('$deadline=(Get-Date).AddSeconds(180)'))){throw 'RESUME_BOUNDED_CYCLE_CONTRACT_CHANGED'}
          if(360 -lt (120+180)){throw 'WATCHDOG_TIMEOUT_BELOW_RESUME_BOUNDED_WAIT'}
          if(420 -le 360){throw 'INSTALLER_DIRECT_TIMEOUT_MUST_EXCEED_WATCHDOG_TIMEOUT'}

          $cmd=Get-Content 'local-agent/bootstrap/RUN_FLOW_RECOVERY_NOW.cmd' -Raw
          foreach($required in @('a8ac6cbc75329dc6472500c169f3226a9a08540e','c3357a722fed085f2660efe951a3ff41418862fa','RECOVERY_BLOB_PIN_MISMATCH','RUN_LOCAL_EXECUTOR_RECOVERY_V1.pinned.ps1')){if(-not$cmd.Contains($required)){throw "MISSING_LAUNCHER_PIN:$required"}}
          $c=Get-Content 'config/flow-extension-canonical-v0.1.0.json' -Raw|ConvertFrom-Json
          if($c.version-ne'0.1.0'){throw 'FLOW_CANONICAL_VERSION_MISMATCH'}
          if($c.extensionId-ne'lgedgmpcikglaajhfclcihicgafimlna'){throw 'FLOW_CANONICAL_ID_MISMATCH'}
          Write-Host 'FLOW_LOCAL_EXECUTOR_RECOVERY_CONTRACT_PASS'
