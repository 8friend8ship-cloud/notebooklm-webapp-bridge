name: Patch Agent1155 raw v2
on:
  push:
    paths:
      - .github/workflows/patch-agent1155-raw-v2-20260829-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          i=0
          changed=False
          while i < len(lines):
              line=lines[i]
              if "    $headers=@{'User-Agent'='HomeDesign-Local-Agent'" in line and i+3 < len(lines) and "$resp=Invoke-RestMethod" in lines[i+1] and "$tmp=$agent+'.download'" in lines[i+2] and "WriteAllBytes" in lines[i+3]:
                  out.append("    $url='https://raw.githubusercontent.com/'+$Repo+'/main/local-agent/releases/1.1.55/HomeDesignLocalAgent.ps1?hdcb='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()")
                  out.append("    $tmp=$agent+'.download'")
                  out.append("    Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp -TimeoutSec 20")
                  i += 4
                  changed=True
                  continue
              if "sourceFetchMode='IMMUTABLE_GIT_BLOB_API'" in line:
                  line=line.replace("sourceFetchMode='IMMUTABLE_GIT_BLOB_API'","sourceFetchMode='RAW_MAIN_RELEASE_PLUS_GIT_BLOB_SHA1_VERIFY'")
                  changed=True
              out.append(line)
              i += 1
          if not changed:
              if any('RAW_MAIN_RELEASE_PLUS_GIT_BLOB_SHA1_VERIFY' in x for x in lines):
                  raise SystemExit(0)
              raise SystemExit('patch target not found')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          grep -Fq 'RAW_MAIN_RELEASE_PLUS_GIT_BLOB_SHA1_VERIFY' local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1
          git diff --check
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local-agent/diagnostics/Test-NotebookLMClaimStartBridge.ps1
          git commit -m 'Use raw verified Agent 1.1.55 fetch'
          git push
